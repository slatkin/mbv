<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mbv palette</title>
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; font: 14px/1.45 system-ui, sans-serif; background: #14181a; color: #e6e6e6; }
header { position: sticky; top: 0; background: #1e2326; padding: 12px 16px; border-bottom: 1px solid #3f3f3f; }
header h1 { font-size: 16px; margin: 0; display: inline; }
header .meta { margin-left: 12px; }
main { padding: 16px; max-width: 1100px; margin: 0 auto; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: #9e9e9e; margin: 24px 0 8px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; }
.card { display: flex; gap: 10px; background: #1e2326; border: 1px solid #3f3f3f; border-radius: 8px; padding: 10px; }
.swatch { width: 56px; height: 56px; border-radius: 6px; flex: none; border: 1px solid #00000066; }
.name { font-weight: 600; font-family: monospace; font-size: 13px; }
.hex { font-family: monospace; color: #dbbc7f; cursor: pointer; }
.prim { font-family: monospace; font-size: 12px; color: #3a94c5; }
.uses { color: #9e9e9e; font-size: 12.5px; margin-top: 2px; }
.meta { font-size: 12px; color: #6c6c6c; }
.dual { display: flex; gap: 4px; }
.dual div { flex: 1; height: 56px; border-radius: 6px; border: 1px solid #00000066; display: flex; align-items: flex-end; justify-content: center; font: 10px monospace; padding-bottom: 2px; }
</style>
</head>
<body>
<header>
<h1>mbv palette</h1>
<span class="meta" id="count"></span>
</header>
<main>
<h2>Roles</h2><div class="grid" id="roles"></div>
<h2>Surfaces</h2><div class="grid" id="surfaces"></div>
<h2>Role sets &amp; specials</h2><div class="grid" id="extra"></div>
</main>

},{"hex":"#1e2326","name":"PILL_SELECTED_FG","primitive":"PILL_SELECTOR_SELECTED_FG","rgb":[30,35,38],"uses":"Selected pill-chip foreground text on the blue fill (slots.rs, widgets.rs, search_sidebar.rs)."},{"hex":"#3c4841","name":"PILL_OVERFLOW_FG","primitive":"BG_GREEN (alias of SURFACE_FOCUSED_BG value)","rgb":[60,72,65],"uses":"Pill-selector overflow/edge accent (widgets.rs)."},{"hex":"#e6e6e6","name":"TEXT_PRIMARY","primitive":"TEXT","rgb":[230,230,230],"uses":"Primary readable content foreground."},{"hex":"#9e9e9e","name":"TEXT_SECONDARY","primitive":"SUBTLE","rgb":[158,158,158],"uses":"Secondary text; pairs with TEXT_PRIMARY/TEXT_STRONG; also HERO_META_ROLES[2]."},{"hex":"#6c6c6c","name":"TEXT_MUTED","primitive":"MUTED","rgb":[108,108,108],"uses":"Dim text, icons, unfocused state."},{"hex":"#bec5b2","name":"PLAYED_ROW_FG","primitive":"PLAYED_ROW","rgb":[190,197,178],"uses":"Played/watched media-list row title (single-part primary, or split-row item title). Reads as watched, dimmer than cream, without moving icons/chrome."},{"hex":"#fdf6e3","name":"TEXT_STRONG","primitive":"WHITE","rgb":[253,246,227],"uses":"Bold titles/headings (warm white)."},{"hex":"#faedcd","name":"TEXT_EMPHASIS","primitive":"SOFT_WHITE","rgb":[250,237,205],"uses":"Warm emphasis text: focused rows, dialogs; also the split-row context colour's backing value."},{"hex":"#dbbc7f","name":"TEXT_FOCUS_ACCENT","primitive":"YELLOW","rgb":[219,188,127],"uses":"Focused-row title accent; queue selected-scope text; paused status; home-video marker; visualizer mid band; status-bar time."},{"hex":"#dbbc7f","name":"TEXT_HERO_TITLE","primitive":"YELLOW","rgb":[219,188,127],"uses":"Hero header title (first metadata line). Same value as focus accent, separate role."},{"hex":"#1a1a1a","name":"TEXT_ON_ACCENT","primitive":"BASE","rgb":[26,26,26],"uses":"Near-black text painted on a coloured surface: context-menu selected row, indicator badges, hint pills."},{"hex":"#3c4841","name":"TEXT_ACCENT_MUTED","primitive ":"#d699b6","name":"INDICATOR_AUDIO_FG","primitive":"PURPLE","rgb":[214,153,182],"uses":"Audio glyph foreground (indicators.rs)."},{"hex":"#83c092","name":"PLAYBACK_VALUE_FG","primitive":"PLAYBACK_CONTENT_FG","rgb":[131,192,146],"uses":"Now-playing title/codec value."},{"hex":"#859289","name":"PLAYBACK_META_FG","primitive":"PLAYBACK_META_FG","rgb":[133,146,137],"uses":"Playback metadata captions/time."},{"hex":"#35a77c","name":"PLAYBACK_TITLE_FG","primitive":"PLAYBACK_TITLE","rgb":[53,167,124],"uses":"Now-playing title row item name. Own primitive (shares AQUA value) so a brand-aqua edit cannot move it."},{"hex":"#dbbc7f","name":"PLAYBACK_CONTEXT_FG","primitive":"PLAYBACK_CONTEXT","rgb":[219,188,127],"uses":"Now-playing title row container (series/artist/show/subscription). Own primitive (shares YELLOW value) so a focus-accent edit cannot move it."},{"hex":"#46545f","name":"PROGRESS_TRACK","primitive":"SEEK_TRACK","rgb":[70,84,95],"uses":"Unplayed seek/progress track."},{"hex":"#48584e","name":"SCROLLBAR","primitive":"SCROLLBAR (alias of BG_GREEN_SOFT value)","rgb":[72,88,78],"uses":"Library/chrome scrollbar track/thumb. Own primitive so a scrollbar edit cannot move the content-body fill."}],"source":["src/app/render/theme/primitives.rs","src/app/render/theme/mod.rs","src/app/render/theme/surface.rs","src/app/render/theme/surface_table.rs","src/app/render/theme/surface_resolve.rs"],"specials":[{"name":"Color::Black","uses":"Popup dim-backdrop blend base (backdrop.rs dims every cell halfway toward black). Not a palette fill."},{"name":"Color::White","uses":"Status-bar pills (status_bar_panel.rs), chrome_status headings. Raw ratatui named colour, not a theme role."},{"name":"Color::Reset","uses":"Transparent/unpainted cells: media-list gutters, marquee parts, card-painter tests. Means 'no fill', not a colour."}],"surfaces":[{"focused":"#3c4841","level":"ColumnPane","name":"QueueColumn","resting":"#333c43","uses":"Queue column gutter + queue boundary strip; follows queue-column focus."},{"focused":"#2d353b","level":"ColumnPane","name":"LibraryColumn","resting":"#2d353b","uses":"Library column gutter + wide Music browser container; fixed, always backdrop."},{"focused":"#2d353b","level":"ColumnPane","name":"WideSplitGutter","resting":"#2d353b","uses":"Wide hero split gap; fixed backdrop."},{"focused":"#3c4841","level":"ColumnPane","name":"HeroPane","resting":"#333c43","uses":"Wide hero right pane (ReadOnly paints resting, Workspace(held) resolves held bit)."},{"focused":"#2d353b","level":"ColumnPane","name":"SelectedRow","resting":"#2d353b","uses":"Library punch-through beneath the list panel; fixed backdrop. Kept for contract; painter now uses SELECTED_ROW_BG bar."},{"focused":"#3c4841","level":"ColumnPane","name":"SelectedRowOnQueueColumn","resting":"#333c43","uses":"Queue list selected row as hole in queue column (queue.rs policy bit). Kept for contract."},{"focused":"#3c4841","level":"ColumnPane","name":"SelectedRowOnLibraryPane","resting":"#333c43","uses":"TV episode / Music track list hole in library pane (tv_wide.rs, music_wide.rs). Kept for contract."},{"focused":"#a7c080","level":"ColumnPane","name":"ContextMenuSelectedRow","resting":"#a7c080","uses":"Popup context-menu selected row; fixed ACCENT_ACTIVE (context_menu.rs)."},{"focused":"#3c4841","level":"ContentBody","name":"LibraryPanel","resting":"#333c43","uses":"Wide-hero rail body + frame across Movies/TV/Music/ABS/Feeds/Home (browser paint, tv_wide, music_wide, feeds, home)."},{"focused":"#48584e","level":"ContentBody","name":"QueuePanel","resting":"#2d353b","soft":true,"uses":"Queue panel body (widgets.rs); soft focused variant, backdrop resting."},{"focused":"#48584e","level":"ContentBody","name":"MainContentBox","resting":"#2d353b","soft":true,"uses":"Pane content box: TV episode listing, Music track listing, generic pane inset (tv_wide, music_wide, wide_hero)."},{"focused":"#3c4841","level":"ContentBody","name":"InlineHero","resting":"#333c43","uses":"Selected row "},{"focused":"#1e2326","level":"ChromeBand","name":"PillRow","resting":"#1e2326","uses":"Pill selector row band; fixed PILL_ROW_BG."},{"focused":"#1e2326","level":"ChromeBand","name":"PillChip","resting":"#1e2326","uses":"Unselected pill chip; fixed PILL_BG."},{"focused":"#3a94c5","level":"ChromeBand","name":"PillChipSelected","resting":"#3a94c5","uses":"Selected library pill chip; fixed PILL_SELECTED_BG blue."},{"focused":"#35a77c","level":"ChromeBand","name":"QueueScopePillSelected","resting":"#35a77c","uses":"Queue selected scope pill; fixed ACCENT aqua = Direct-remote indicator (queue.rs), not library-pill blue."},{"focused":"#2d353b","level":"ChromeBand","name":"PillRowGap","resting":"#2d353b","uses":"Home pill-bar spacer band (home.rs); fixed backdrop."},{"focused":"#1e2326","level":"ChromeBand","name":"SidebarBand","resting":"#1e2326","uses":"Sidebar header/footer band; fixed."},{"focused":"#535353","level":"ChromeBand","name":"NonHeroSidebarBand","resting":"#535353","uses":"Non-hero sidebar band; fixed SURFACE_ITEM_FOCUSED."},{"focused":"#1e2326","level":"ChromeBand","name":"TabBar","resting":"#1e2326","uses":"Tab bar band (chrome_tabs.rs); fixed."},{"focused":"#3c4841","level":"Popup","name":"PopupFrame","resting":"#3c4841","uses":"Every modal frame background (modal_frame.rs); fixed."},{"focused":"#000000","level":"Popup","name":"PopupDimBackdrop","resting":"#000000","uses":"Dim backdrop: blends cells halfway toward black (backdrop.rs dim); row value is the blend base, not a rect fill."}]};
function div(cls, text) {
  const el = document.createElement('div');
  if (cls) el.className = cls;
  if (text != null) el.textContent = text;
  return el;
}
function clear(el) { while (el.firstChild) el.removeChild(el.firstChild); }
function roleCard(r) {
  const el = div('card');
  const sw = div('swatch');
  sw.style.background = r.hex;
  sw.title = r.hex;
  const body = div();
  body.appendChild(div('name', r.name));
  const row = div();
  const hex = document.createElement('span');
  hex.className = 'hex';
  hex.textContent = r.hex;
  hex.title = 'click to copy';
  hex.dataset.hex = r.hex;
  const prim = document.createElement('span');
  prim.className = 'prim';
  prim.textContent = ' ' + r.primitive;
  row.appendChild(hex);
  row.appendChild(prim);
  body.appendChild(row);
  body.appendChild(div('uses', r.uses));
  el.appendChild(sw);
  el.appendChild(body);
  return el;
}
function surfaceCard(s) {
  const el = div('card');
  const wrap = div();
  wrap.style.cssText = 'flex:none;width:56px';
  const dual = div('dual');
  const f = div(null, 'F');
  f.style.background = s.focused;
  f.title = 'focused ' + s.focused;
  const rst = div(null, 'R');
  rst.style.background = s.resting;
  rst.title = 'resting ' + s.resting;
  dual.appendChild(f);
  dual.appendChild(rst);
  wrap.appendChild(dual);
  const body = div();
  body.appendChild(div('name', s.name));
  body.appendChild(div('meta', s.level + (s.soft ? ' \u00b7 soft' : '') + ' \u00b7 F ' + s.focused + ' \u00b7 R ' + s.resting));
  body.appendChild(div('uses', s.uses));
  el.appendChild(wrap);
  el.appendChild(body);
  return el;
}
function roleSetCard(name, rs) {
  const el = div('card');
  const wrap = div();
  wrap.style.cssText = 'flex:none;width:56px';
  const row = div();
  row.style.cssText = 'display:flex;gap:2px';
  for (const m of rs.members) {
    const role = (DATA.roles || []).find(r => r.name === m);
    const chip = div();
    chip.style.cssText = 'flex:1;height:28px;background:' + (role ? role.hex : (/^#/.test(m) ? m : '#333')) + ';border-radius:4px';
    chip.title = m;
    row.appendChild(chip);
  }
  wrap.appendChild(row);
  const body = div();
  body.appendChild(div('name', name));
  body.appendChild(div('meta', rs.members.join(' \u00b7 ')));
  body.appendChild(div('uses', rs.uses));
  el.appendChild(wrap);
  el.appendChild(body);
  return el;
}
function renderAll() {
const roles = document.getElementById('roles'), surfaces = document.getElementById('surfaces'), extra = document.getElementById('extra');
clear(roles); clear(surfaces); clear(extra);
let n = 0;
for (const r of DATA.roles) { roles.appendChild(roleCard(r)); n++; }
for (const s of DATA.surfaces) { surfaces.appendChild(surfaceCard(s)); n++; }
for (const [name, rs] of Object.entries(DATA.role_sets || {})) { extra.appendChild(roleSetCard(name, rs)); n++; }
for (const s of DATA.specials || []) {
  const el = div('card');
  const body = div();
  body.appendChild(div('name', s.name));
  body.appendChild(div('uses', s.uses));
  el.appendChild(body);
  extra.appendChild(el);
  n++;
}
document.getElementById('count').textContent = n + ' colours \u00b7 generated ' + DATA.generated + (DATA.live ? ' \u00b7 live from palette.json' : '');
}
renderAll();
fetch('./palette.json').then(r => { if (!r.ok) throw 0; return r.json(); }).then(d => {
  if (JSON.stringify(d) !== JSON.stringify(DATA)) { DATA = Object.assign(d, { live: true }); renderAll(); }
}).catch(() => {});
document.addEventListener('click', e => {
  const t = e.target.closest('.hex');
  if (t && navigator.clipboard) navigator.clipboard.writeText(t.dataset.hex);
});
</script>
