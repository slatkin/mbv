<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mbv palette</title>
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; font: 14px/1.45 system-ui, sans-serif; background: #14181a; color: #e6e6e6; }
header { position: sticky; top: 0; background: #1e2326; padding: 12px 16px; border-bottom: 1px solid #3f3f3f; }
header h1 { font-size: 16px; margin: 0; display: inline; }
header .meta { margin-left: 12px; }
main { padding: 16px; max-width: 1100px; margin: 0 auto; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: #9e9e9e; margin: 24px 0 8px; }
.card { display: flex; gap: 10px; background: #1e2326; border: 1px solid #3f3f3f; border-radius: 8px; padding: 10px; }
.name { font-weight: 600; font-family: monospace; font-size: 13px; }
.hex { font-family: monospace; color: #dbbc7f; cursor: pointer; }
.rname { font-family: monospace; font-size: 12px; color: #3a94c5; }
.uses { color: #9e9e9e; font-size: 12.5px; margin-top: 2px; }
.uses li { margin: 2px 0; }
.uses ul { margin: 4px 0 0; padding-left: 18px; }
.tabs { display: flex; gap: 4px; }
.tabs button { background: #1e2326; color: #9e9e9e; border: 1px solid #3f3f3f; border-radius: 6px 6px 0 0; padding: 6px 14px; font: inherit; cursor: pointer; }
.tabs button.active { color: #e6e6e6; border-bottom-color: #e6e6e6; }
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #3f3f3f; vertical-align: top; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: #9e9e9e; }
td.name, td .vname { font-family: monospace; }
.cellsw { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.mini { width: 28px; height: 28px; border-radius: 4px; flex: none; border: 1px solid #00000066; }
th[data-key] { cursor: pointer; white-space: nowrap; }
.note { color: #6c6c6c; font-size: 12px; margin: 14px 0 6px; }
</style>
</head>
<body>
<header>
<h1>mbv palette</h1>
<span class="meta" id="count"></span>
</header>
<main>
<div class="tabs"><button id="tabbtn-surfaces" class="active">Surfaces</button><button id="tabbtn-text">Text</button><button id="tabbtn-palette">Palette</button></div>

<section id="tab-text" hidden><div class="tablewrap"><table id="roles"><thead><tr><th data-key="name" data-type="str">Role</th><th data-key="refs" data-type="num">Refs</th><th data-key="colour" data-type="str">Colour</th><th data-key="uses" data-type="str">Description</th></tr></thead><tbody></tbody></table></div></section>

let DATA = {"role_sets":{"HERO_META_ROLES":{"members":["TextDetailMeta","TextMetadata","TextSecondary"],"uses":"Hero header metadata painter: colours meta row n with HERO_META_ROLES[n % 3] (hero_header.rs). The three colours hero headers already used, defined once so destinations cannot style metadata."},"HINT_CHIPS":{"members":["#3a94c5","#dbbc7f","#e59875"],"uses":"Library Hero overlay display-only hint chips, rotated by chip index (widgets.rs hint pills). Chip surfaces, not text roles, so a text-colour edit cannot move them."}},"roles":[{"hex":"#e6e6e6","name":"TextPrimary","rgb":[230,230,230],"slot":"Fg","uses":"Primary readable content foreground."},{"hex":"#9e9e9e","name":"TextSecondary","rgb":[158,158,158],"slot":"FgMuted","uses":"Secondary text; pairs with TextPrimary/TextStrong; also HERO_META_ROLES[2]."},{"hex":"#9e9e9e","name":"TextMuted","rgb":[158,158,158],"slot":"FgMuted","uses":"Dim text, icons, unfocused state; unselected library tab and pill-chip text; played/watched media-list row titles (chrome_tabs.rs, slots.rs, widgets.rs, queue.rs, search_sidebar.rs, media_list/row.rs)."},{"hex":"#fdf6e3","name":"TextStrong","rgb":[253,246,227],"slot":"FgBright","uses":"Bold titles/headings (warm white)."},{"hex":"#faedcd","name":"TextEmphasis","rgb":[250,237,205],"slot":"FgWarm","uses":"Warm emphasis text: focused rows, dialogs; also the split-row context colour's backing value."},{"hex":"#d699b6","name":"TabSelectedUnderline","rgb":[214,153,182],"slot":"Purple","uses":"The selected tab's underline run in the tab bar: upper-eighth blocks on the row below the tab text, spanning exactly the selected title (chrome_tabs.rs). Experimenting with Mauve; replaced the underline's original TextEmphasis value."},{"hex":"#dbbc7f","name":"TextFocusAccent","rgb":[219,188,127],"slot":"Yellow","uses":"Focused-row title accent; queue selected-scope text; paused status; home-video marker; visualizer mid band; status-bar time."},{"hex":"#dbbc7f","name":"TextHeroTitle","rgb":[219 status_bar_panel.rs), chrome_status headings. Raw ratatui named colour, not a theme role."},{"name":"Color::Reset","uses":"Transparent/unpainted cells: media-list gutters, marquee parts, card-painter tests. Means 'no fill', not a colour."}],"surfaces":[{"focused":"#9e9e9e","focusedSlot":"FgMuted","name":"ArtworkLoadingPlaceholder","resting":"#9e9e9e","restingSlot":"FgMuted","uses":"Artwork-loading inset fill (card.rs, album_art.rs, hero painters). Own fill over TextMuted's slot (FgMuted): equal today, independently editable."},{"focused":"#272e33","focusedSlot":"Bg0","name":"ArtworkPlaceholder","resting":"#272e33","restingSlot":"Bg0","uses":"No-artwork surface; fixed backdrop."},{"focused":"#2b3238","focusedSlot":"Bg1","name":"CreditsStripe","resting":"#2b3238","restingSlot":"Bg1","uses":"Alternating credits-row stripe background (overview_box.rs); the HeroCreditsStripe role's identity, folded into the table."},{"focused":"#1e2326","focusedSlot":"BgDim","name":"HeroPane","resting":"#1e2326","restingSlot":"BgDim","uses":"Wide hero right pane / Library Hero overlay sheet: the dark chrome the hero content repaints its own background with, fixed in both focus states (wide_hero.rs, hero overlay). Was focus-reactive content before the 2026-09-20 sheet decision."},{"focused":"#3a94c5","focusedSlot":"Blue","name":"HintChip0","resting":"#3a94c5","restingSlot":"Blue","uses":"Library Hero overlay's first display-only hint chip (widgets.rs). One of three chip surfaces (HINT_CHIPS), rotated by chip index; chip surfaces, not text roles, so a text-colour edit cannot move them."},{"focused":"#dbbc7f","focusedSlot":"Yellow","name":"HintChip1","resting":"#dbbc7f","restingSlot":"Yellow","uses":"Library Hero overlay's second display-only hint chip (widgets.rs). One of three chip surfaces (HINT_CHIPS), rotated by chip index; chip surfaces, not text roles, so a text-colour edit cannot move them."},{"focused":"#e59875","focusedSlot":"Orange","name":"HintChip2","resting":"#e59875","resting function div(cls, text) {
  const el = document.createElement('div');
  if (cls) el.className = cls;
  if (text != null) el.textContent = text;
  return el;
}
function clear(el) { while (el.firstChild) el.removeChild(el.firstChild); }
let sortKeyV = 'name', sortTypeV = 'str', sortDirV = 1;
function slotKey(v, key) {
  const roles = (DATA.roles || []).filter(r => r.slot === v.name);
  if (key === 'refs') return roles.length;
  if (key === 'colour') return v.hex;
  if (key === 'roles') return roles.map(r => r.name).join(',');
  return v.name;
}
function renderSlots() {
  const tb = document.querySelector('#slots tbody');
  clear(tb);
  const rows = (DATA.slots || []).slice().sort((a, b) => {
    const ka = slotKey(a, sortKeyV), kb = slotKey(b, sortKeyV);
    const c = sortTypeV === 'num' ? ka - kb : String(ka).localeCompare(String(kb));
    return c * sortDirV || String(a.name).localeCompare(String(b.name));
  });
  for (const v of rows) {
    const roles = (DATA.roles || []).filter(r => r.slot === v.name);
    const tr = document.createElement('tr');
    const nm = document.createElement('td');
    nm.className = 'name';
    nm.textContent = v.name;
    tr.appendChild(nm);
    const rc = document.createElement('td');
    rc.textContent = roles.length;
    tr.appendChild(rc);
    const td = document.createElement('td');
    const wrap = div('cellsw');
    const sw = div('mini');
    sw.style.background = v.hex;
    sw.title = v.hex;
    wrap.appendChild(sw);
    const hx = document.createElement('span');
    hx.className = 'hex';
    hx.textContent = v.hex;
    hx.title = 'click to copy';
    hx.dataset.hex = v.hex;
    wrap.appendChild(hx);
    td.appendChild(wrap);
    tr.appendChild(td);
    const d = document.createElement('td');
    d.className = 'uses';
    if (roles.length) {
      for (const r of roles) {
        const line = div();
        const rn = document.createElement('span');
        rn.className = 'rname';
        rn.textContent = r.name;
        line.appendChild(rn);
        line.appendChild(document.createTextNode(' — ' + r.uses));
        d.appendChild(line);
      }
    } else {
      d.textContent = 'No roles derive from this slot.';
    }
    tr.appendChild(d);
    tb.appendChild(tr);
  }
}
function updateSortIndicatorsV() {
  document.querySelectorAll('#slots th[data-key]').forEach(th => {
    th.textContent = th.dataset.label + (th.dataset.key === sortKeyV ? (sortDirV === 1 ? ' ▲' : ' ▼') : '');
  });
}
function slotName(hex) {
  const v = (DATA.slots || []).find(v => v.hex.toLowerCase() === String(hex).toLowerCase());
  return v ? v.name : null;
}
function surfaceCell(hex) {
  const td = document.createElement('td');
