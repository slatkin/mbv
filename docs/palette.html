<!DOCTYPE html>

<title>mbv palette</title>
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; font: 14px/1.45 system-ui, sans-serif; background: #14181a; color: #e6e6e6; }
header { position: sticky; top: 0; background: #1e2326; padding: 12px 16px; border-bottom: 1px solid #3f3f3f; }
header h1 { font-size: 16px; margin: 0; display: inline; }
header .meta { margin-left: 12px; }
main { padding: 16px; max-width: 1100px; margin: 0 auto; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: #9e9e9e; margin: 24px 0 8px; }
.card { display: flex; gap: 10px; background: #1e2326; border: 1px solid #3f3f3f; border-radius: 8px; padding: 10px; }
.name { font-weight: 600; font-family: monospace; font-size: 13px; }
.hex { font-family: monospace; color: #dbbc7f; cursor: pointer; }
.rname { font-family: monospace; font-size: 12px; color: #3a94c5; }
.uses { color: #9e9e9e; font-size: 12.5px; margin-top: 2px; }
.uses li { margin: 2px 0; }
.uses ul { margin: 4px 0 0; padding-left: 18px; }
.tabs { display: flex; gap: 4px; }
.tabs button { background: #1e2326; color: #9e9e9e; border: 1px solid #3f3f3f; border-radius: 6px 6px 0 0; padding: 6px 14px; font: inherit; cursor: pointer; }
.tabs button.active { color: #e6e6e6; border-bottom-color: #e6e6e6; }
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #3f3f3f; vertical-align: top; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: #9e9e9e; }
td.name, td .vname { font-family: monospace; }
.cellsw { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.mini { width: 28px; height: 28px; border-radius: 4px; flex: none; border: 1px solid #00000066; }
th[data-key] { cursor: pointer; white-space: nowrap; }
.note { color: #6c6c6c; font-size: 12px; margin: 14px 0 6px; }
</style>
</head>

function div(cls, text) {

}
