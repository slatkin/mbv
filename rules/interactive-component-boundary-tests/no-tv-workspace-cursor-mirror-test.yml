id: no-tv-workspace-cursor-mirror
valid:
  - |
    struct Model;
    impl Model {
        fn handle(&mut self, lib_idx: usize) {
            // Effects resolve the component's own selection; no App-side mirror.
            self.push_tv_workspace_content();
        }
    }
invalid:
  - |
    struct Model;
    impl Model {
        fn handle(&mut self, lib_idx: usize) {
            self.mirror_tv_workspace_cursor(lib_idx);
        }
    }
  - |
    struct Model;
    impl Model {
        fn mirror_tv_workspace_cursor(&mut self, lib_idx: usize) {
            let _ = lib_idx;
        }
    }
