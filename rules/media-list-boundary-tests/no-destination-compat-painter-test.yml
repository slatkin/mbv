id: no-destination-compat-painter
valid:
  - |
    // Destinations paint rows only through the passed-in control's view.
    fn paint(f: &mut Frame, area: Rect, list: &mut Wide) {
        tuirealm::component::Component::view(list, f, area);
    }
invalid:
  - |
    // Calling the subsystem paint adapter directly is a regression.
    fn paint(f: &mut Frame, area: Rect, list: &mut Wide) {
        render_wide_media_list_component(f, area, list, policy);
    }
  - |
    fn paint_inline(f: &mut Frame, area: Rect, list: &mut Inline) {
        render_inline_media_browser_component(f, area, list, policy);
    }
