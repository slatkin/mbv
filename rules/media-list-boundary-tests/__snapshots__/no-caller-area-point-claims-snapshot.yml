id: no-caller-area-point-claims
snapshots:
  ? |
    // Caller-supplied `list_area` point claims are deleted.
    fn wheel(carrier: &Carrier, area: Rect, at: Position) -> bool {
        carrier.claims_point(area, at)
    }
  : labels:
    - source: carrier.claims_point(area, at)
      style: primary
      start: 125
      end: 155
  ? |
    // Caller-supplied point resolution is deleted.
    fn click(list: &Wide, area: Rect, at: Position) -> Option<String> {
        list.resolve_point(area, at).cloned()
    }
  : labels:
    - source: list.resolve_point(area, at)
      style: primary
      start: 120
      end: 148
