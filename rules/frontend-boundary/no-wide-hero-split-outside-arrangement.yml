id: no-wide-hero-split-outside-arrangement
language: rust
severity: error
message: >-
  `wide_hero_split` is the Wide hero arrangement's raw geometry primitive and
  must stay confined to `src/app/render/arrangements/wide_hero.rs`. Callers go
  through the override-taking exits -- `wide_hero_presentation`,
  `wide_library_panes`, or `wide_hero_hero_pane` -- so every surface applies
  the session split override and the breakpoint predicate stays the single
  geometry gate. See openspec/changes/add-mouse-wide-split-resize/design.md.
files:
  - "src/app/**/*.rs"
ignores:
  - "src/app/render/arrangements/wide_hero.rs"
  - "**/*tests*.rs"
rule:
  kind: call_expression
  has:
    field: function
    any:
      - kind: identifier
        regex: "^wide_hero_split$"
      - kind: scoped_identifier
        has:
          field: name
          kind: identifier
          regex: "^wide_hero_split$"
