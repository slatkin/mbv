id: no-destination-row-map-reconstruction
language: rust
severity: error
message: >-
  `left_row_map` / `left_item_rows` are the legacy parent row maps. They may
  only be produced/consumed inside the render component subsystem (the
  canonical media-list painters plus the out-of-scope Inline Search row
  planner); a destination must resolve rows from the shared owner's retained
  current-frame geometry instead of reconstructing a parent row map. See
  openspec/changes/complete-shared-media-list-ownership design.md D6/D7.
files:
  - "src/app/**/*.rs"
ignores:
  - "src/app/render/components/**"
  - "src/app/layout.rs"
  - "src/app/render/test_helpers_fixtures.rs"
  - "src/app/shell_browser_test_support.rs"
  - "src/app/**/*tests*.rs"
  - "src/app/**/tests*.rs"
rule:
  kind: field_expression
  has:
    kind: field_identifier
    regex: "^(left_row_map|left_item_rows)$"
