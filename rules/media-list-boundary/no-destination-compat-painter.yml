id: no-destination-compat-painter
language: rust
severity: error
message: >-
  `render_wide_media_list_component` / `render_inline_media_browser_component`
  are the media-list subsystem's internal paint adapters. A destination paints
  media rows only through the passed-in canonical control's `Component::view`,
  which runs the same adapter inside the subsystem; it must not call the
  adapters directly. See
  openspec/changes/complete-shared-media-list-ownership design.md D6/D7 and the
  canonical-media-lists "WideMediaList owns fixed-row mechanics" spec.
files:
  - "src/app/components/**/*.rs"
ignores:
  - "src/app/components/media_list/**"
  - "src/app/**/*tests*.rs"
  - "src/app/**/tests*.rs"
rule:
  any:
    - pattern: render_wide_media_list_component($$$ARGS)
    - pattern: render_inline_media_browser_component($$$ARGS)
