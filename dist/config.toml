[server]
url = "http://emby.local:8096"

[general]
hidden_libraries = ["live tv"]
show_log_tab = false

[mpv]
use_mpv_config     = false
show_audio_window  = false
audio_pipe_enabled    = false
audio_pipe_path       = "/tmp/mbv-pipe"
audio_pipe_samplerate = 44100
audio_pipe_bitdepth   = 16
# Optional user-calibrated estimate after mbv starts pipe output. It only
# drives progress display and duplicate-play guarding; mbv never contacts the
# downstream consumer. Omit it when the delay is unknown.
# audio_pipe_playout_delay_ms = 1250

[daemon]
show_systray_icon = true
# F2 is the normal way to select a friendly device and save its routable endpoint.
# [library_routes]
# music = "tcp://192.0.2.10:17831"
