<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>mbv popovers and row menu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#232a2e}
a{color:#83c092}a:hover{color:#a7c080}
button{font:inherit}
</style>
</helmet>
<div style="width: 400px; height: 880px; box-sizing: border-box; background: #232a2e; color: #d3c6aa; font-family: 'IBM Plex Sans', system-ui, sans-serif; padding: 24px 16px; display: flex; flex-direction: column; gap: 28px">

  <!-- Subtitle popover -->
  <div style="display: flex; flex-direction: column; gap: 10px">
    <div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.08em; color: #9da9a0">CC CHIP → POPOVER</div>
    <div style="display: flex; gap: 8px">
      <button style="height: 32px; padding: 0 10px; background: #343f44; border: 1px solid #475258; border-radius: 6px; color: #e69875; font-family: 'JetBrains Mono', monospace; font-size: 12px">FHD · direct</button>
      <button style="height: 32px; padding: 0 10px; background: #343f44; border: 1px solid #475258; border-radius: 6px; color: #e69875; font-family: 'JetBrains Mono', monospace; font-size: 12px">EN 2.0</button>
      <button aria-expanded="true" style="height: 32px; padding: 0 10px; background: #475258; border: 1px solid #e69875; border-radius: 6px; color: #e69875; font-family: 'JetBrains Mono', monospace; font-size: 12px">CC EN</button>
    </div>
    <div role="dialog" aria-label="Subtitles" style="width: 260px; margin-left: 110px; background: #343f44; border: 1px solid #475258; border-radius: 8px; box-shadow: 0 12px 32px rgba(0,0,0,0.45); padding: 6px; display: flex; flex-direction: column; gap: 2px">
      <button style="height: 36px; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; background: none; border: 0; border-radius: 4px; color: #d3c6aa; font-size: 13px; text-align: left">Off</button>
      <button style="height: 36px; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; background: #3d484d; border: 0; border-radius: 4px; color: #e9e1cc; font-size: 13px; text-align: left">English · SRT<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#a7c080" stroke-width="2.5" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg></button>
      <button style="height: 36px; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; background: none; border: 0; border-radius: 4px; color: #d3c6aa; font-size: 13px; text-align: left">English SDH · embedded</button>
      <div style="height: 1px; background: #475258; margin: 4px 0"></div>
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 4px 10px">
        <span style="font-size: 12px; color: #9da9a0">Offset</span>
        <div style="display: flex; align-items: center; gap: 4px">
          <button aria-label="Subtitles earlier" style="width: 32px; height: 32px; background: #2d353b; border: 0; border-radius: 4px; color: #d3c6aa">−</button>
          <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; width: 52px; text-align: center; color: #e9e1cc">+0.25s</span>
          <button aria-label="Subtitles later" style="width: 32px; height: 32px; background: #2d353b; border: 0; border-radius: 4px; color: #d3c6aa">+</button>
        </div>
      </div>
      <div style="padding: 2px 10px 6px; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #9da9a0">c · cycle   [ ] · offset</div>
    </div>
  </div>

  <!-- Row menu -->
  <div style="display: flex; flex-direction: column; gap: 10px">
    <div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.08em; color: #9da9a0">ROW HOVER + CONTEXT MENU</div>
    <div style="background: #2d353b; border-radius: 6px; padding: 4px">
      <div style="height: 30px; display: flex; align-items: center; gap: 10px; padding: 0 8px; color: #d3c6aa">
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; width: 18px; color: #7f897d">11</span>
        <span style="font-size: 13.5px; flex: 1 1 auto">Dream Job</span>
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #9da9a0">24:48</span>
      </div>
      <div style="height: 30px; display: flex; align-items: center; gap: 10px; padding: 0 2px 0 4px; background: #3d484d; border-radius: 4px; color: #e9e1cc">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="#9da9a0" aria-hidden="true"><circle cx="9" cy="6" r="1.6"></circle><circle cx="15" cy="6" r="1.6"></circle><circle cx="9" cy="12" r="1.6"></circle><circle cx="15" cy="12" r="1.6"></circle><circle cx="9" cy="18" r="1.6"></circle><circle cx="15" cy="18" r="1.6"></circle></svg>
        <span style="font-size: 13.5px; flex: 1 1 auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Business Secrets of the Pharaohs</span>
        <button aria-label="Row actions" style="width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; background: #475258; border: 0; border-radius: 4px; color: #e9e1cc"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="19" cy="12" r="2"></circle></svg></button>
      </div>
      <div style="height: 30px; display: flex; align-items: center; gap: 10px; padding: 0 8px; color: #d3c6aa">
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; width: 18px; color: #7f897d">29</span>
        <span style="font-size: 13.5px; flex: 1 1 auto">St. Hospitals</span>
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #9da9a0">23:54</span>
      </div>
    </div>
    <div role="menu" aria-label="Row actions" style="width: 230px; margin-left: 154px; margin-top: -40px; background: #343f44; border: 1px solid #475258; border-radius: 8px; box-shadow: 0 12px 32px rgba(0,0,0,0.45); padding: 6px; display: flex; flex-direction: column; gap: 2px">
      <button role="menuitem" style="height: 34px; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; background: #3d484d; border: 0; border-radius: 4px; color: #e9e1cc; font-size: 13px">Play now<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #9da9a0">⏎</span></button>
      <button role="menuitem" style="height: 34px; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; background: none; border: 0; border-radius: 4px; color: #d3c6aa; font-size: 13px">Play next<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #9da9a0">n</span></button>
      <button role="menuitem" style="height: 34px; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; background: none; border: 0; border-radius: 4px; color: #d3c6aa; font-size: 13px">Mark watched<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #9da9a0">w</span></button>
      <button role="menuitem" style="height: 34px; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; background: none; border: 0; border-radius: 4px; color: #d3c6aa; font-size: 13px">Go to episode<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #9da9a0">g</span></button>
      <div style="height: 1px; background: #475258; margin: 4px 0"></div>
      <button role="menuitem" style="height: 34px; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; background: none; border: 0; border-radius: 4px; color: #e67e80; font-size: 13px">Remove from queue<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #9da9a0">dd</span></button>
    </div>
  </div>

  <!-- Drag -->
  <div style="display: flex; flex-direction: column; gap: 10px">
    <div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.08em; color: #9da9a0">DRAG REORDER · or Alt+J / Alt+K</div>
    <div style="background: #2d353b; border-radius: 6px; padding: 4px; position: relative">
      <div style="height: 30px; display: flex; align-items: center; gap: 10px; padding: 0 8px">
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; width: 18px; color: #7f897d">03</span>
        <span style="font-size: 13.5px; flex: 1 1 auto">Threeism</span>
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #9da9a0">24:45</span>
      </div>
      <div style="height: 2px; background: #83c092; margin: 0 8px; border-radius: 1px"></div>
      <div style="height: 30px; display: flex; align-items: center; gap: 10px; padding: 0 8px">
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; width: 18px; color: #7f897d">04</span>
        <span style="font-size: 13.5px; flex: 1 1 auto">The Love Bunker</span>
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #9da9a0">23:13</span>
      </div>
      <div style="position: absolute; left: 28px; right: -6px; top: 22px; height: 30px; display: flex; align-items: center; gap: 10px; padding: 0 8px; background: #475258; border-radius: 4px; box-shadow: 0 8px 20px rgba(0,0,0,0.5); transform: rotate(-1deg); color: #e9e1cc">
        <span style="font-size: 13.5px; flex: 1 1 auto">Jeremy at JLB</span>
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #e69875">5%</span>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":400,"height":880}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
