schema: spec-driven

context: |
  Tech stack: Rust, Ratatui, TuiRealm, libmpv
  Domain: multi-protocol media server client

rules:
  tasks:
    - Keep tasks small enough for one agent without filling its compact window.
    - Do not require acceptance testing in tasks. Acceptance testing is post-implementation.
  specs:
    - Specs state behavior and layout, never paint.
    - Never pin strings, glyphs, colors, spacing, alignment, truncation.
    - An intentional look change supersedes prior style text; no spec delta.

operations:
  archive:
    guidance:
      - Always sync without asking the user.
# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

