name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

# New pushes supersede stale runs on the same ref: only the tip builds.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Install system dependencies
        # Headers for the -sys crates (libmpv2-sys via bindgen needs clang).
        # Debug-profile check only: no release build, no test run — those stay
        # on the main PKGBUILD workflow (build.yml).
        run: >
          sudo apt-get update -qq &&
          sudo apt-get install -y -qq
          pkg-config libssl-dev libmpv-dev libpipewire-0.3-dev clang

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
