name: CI

on:
  pull_request:

# New pushes supersede stale runs on the same ref (e.g. rapid dependabot
# rebases or fix pushes): only the tip builds.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # Same pinned base-devel snapshot as the PKGBUILD workflow, so PR checks
    # run against the same toolchain that builds releases.
    container: archlinux/archlinux:base-devel-20260818.0.575430
    permissions:
      contents: read

    steps:
      - name: Update system and install makedeps
        run: |
          pacman_retry() {
            for attempt in 1 2 3; do
              "$@" && return 0
              pacman -Syy --noconfirm
              sleep $((attempt * 10))
            done
            "$@"
          }
          pacman_retry pacman -Syu --noconfirm
          pacman_retry pacman -S --noconfirm --needed rust clang nasm mpv pipewire openssl dpkg github-cli git openssh

      - uses: actions/checkout@v7

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Record Rust toolchain version
        run: echo "RUSTC_VER=$(rustc --version | tr ' ' '_')" >> "$GITHUB_ENV"

      - name: Cache Rust build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-deb
            target
          key: ${{ runner.os }}-cargo-${{ env.RUSTC_VER }}-base-devel-20260818.0.575430-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build and test
        # Same fd-budget throttling as the release build (see build.yml).
        run: cargo nextest run --release --test-threads=4 && cargo build --release
