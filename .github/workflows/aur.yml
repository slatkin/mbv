name: Publish AUR

# Publishes the AUR package for an already-published GitHub release, so it can
# be triggered (and retried) any number of times without rebuilding anything.
# The PKGBUILD commit that used to run inside the PKGBUILD build workflow now
# lives here: this workflow regenerates PKGBUILD/.SRCINFO from the release
# tarball and pushes it to aur.archlinux.org. Failures here are isolated from
# the build/release workflow.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to publish to AUR, e.g. "0.15.5" or "v0.15.5". Must match an existing GitHub release tag "v<version>".'
        required: true
        type: string

concurrency:
  group: aur-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Same pinned base-devel snapshot as the PKGBUILD workflow, so this job has
    # a reproducible pacman/makepkg/git toolchain.
    container: archlinux/archlinux:base-devel-20260818.0.575430
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Update system and install tooling
        run: |
          pacman_retry() {
            for attempt in 1 2 3; do
              "$@" && return 0
              pacman -Syy --noconfirm
              sleep $((attempt * 10))
            done
            "$@"
          }
          pacman_retry pacman -Syu --noconfirm
          pacman_retry pacman -S --noconfirm --needed github-cli openssh git

      - name: Normalize version input
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="${VERSION_INPUT#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version '${VERSION_INPUT}'; expected e.g. 0.15.5 or v0.15.5" >&2
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "TAG=v${VERSION}" >> "$GITHUB_ENV"

      - name: Download release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/release
          gh release download "${TAG}" \
            --pattern "mbv-${VERSION}-linux-x86_64.tar.gz" \
            --dir /tmp/release --clobber
          test -s "/tmp/release/mbv-${VERSION}-linux-x86_64.tar.gz"
          echo "Downloaded release asset for ${TAG}"

      - name: Publish to AUR
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${AUR_SSH_KEY}" ]]; then
            echo "AUR_SSH_KEY secret is not set; cannot publish to AUR." >&2
            exit 1
          fi
          SHA256=$(sha256sum "/tmp/release/mbv-${VERSION}-linux-x86_64.tar.gz" | cut -d' ' -f1)
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" PKGBUILD
          sed -i "s/^sha256sums=.*/sha256sums=('${SHA256}')/" PKGBUILD
          # Install the AUR SSH key with restrictive permissions. The secret is
          # auto-masked in logs, so never echo it back.
          mkdir -p /root/.ssh
          umask 077
          printf '%s\n' "${AUR_SSH_KEY}" | tr -d '\r' > /root/.ssh/aur
          chmod 600 /root/.ssh/aur
          export GIT_SSH_COMMAND="ssh -i /root/.ssh/aur -o StrictHostKeyChecking=accept-new"
          git config --global --add safe.directory '*'
          git clone ssh://aur@aur.archlinux.org/mbv.git /tmp/aur-mbv
          cp PKGBUILD /tmp/aur-mbv/PKGBUILD
          useradd -m aurbuild
          chown -R aurbuild /tmp/aur-mbv
          su -c 'cd /tmp/aur-mbv && makepkg --printsrcinfo' aurbuild > /tmp/aur-mbv/.SRCINFO
          cd /tmp/aur-mbv
          git config user.name "mbv release"
          git config user.email "github@poo.town"
          git add PKGBUILD .SRCINFO
          git diff --staged --quiet || git commit -m "Release v${VERSION}"
          git push
