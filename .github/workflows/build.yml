name: PKGBUILD

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'openspec/**'
      - 'assets/**'
  workflow_dispatch:

# One commit means one build. tools/release.sh pushes main and then the tag,
# so the same commit would otherwise be built twice (~7min each in the Arch
# container):
# once on refs/heads/main, once on refs/tags/v*. Keying on the commit SHA makes
# the tag run supersede the branch run.
#
# The asymmetry matters: only an incoming *tag* run cancels (it is the last and
# authoritative ref, and it publishes). An incoming branch run waits its turn,
# so if the two pushes were ever received out of order the release still runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-latest
    # Pin a dated snapshot of the Arch base-devel builder image instead of the
    # floating `base-devel` tag. Arch is rolling, so bump this periodically
    # (dated archlinux tags are retained ~18 months on Docker Hub) and keep the
    # base-devel-... literal in the cargo cache key below in sync.
    container: archlinux/archlinux:base-devel-20260818.0.575430
    permissions:
      contents: write
      actions: write

    steps:
      # The pinned archlinux base-devel image ships no git, and
      # actions/checkout falls back to a REST API archive download when git is
      # missing from the PATH. That yields no .git directory, which breaks the
      # "Commit PKGBUILD" step below. Install makedeps (including git) first so
      # checkout performs a real git clone.
      - name: Update system and install makedeps
        run: |
          pacman_retry() {
            for attempt in 1 2 3; do
              "$@" && return 0
              pacman -Syy --noconfirm
              sleep $((attempt * 10))
            done
            "$@"
          }
          pacman_retry pacman -Syu --noconfirm
          # `rustup` instead of `rust`: the Arch `rust` package is rebuilt for
          # every upstream point release and package revision, and each bump
          # invalidates the cargo cache below (~17 min full rebuild). The
          # toolchain comes from the pinned rust-toolchain.toml instead, so it
          # changes only when that pin is bumped deliberately. clang stays a
          # system package (native build-script tooling, not a cache-keyed
          # compiler).
          pacman_retry pacman -S --noconfirm --needed rustup clang nasm mpv pipewire openssl dpkg github-cli git openssh zig wayland libxkbcommon fontconfig

      - uses: actions/checkout@v7

      - name: Cache Rust build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            ~/.cargo/advisory-db
            ~/.rustup/toolchains
            target
          # Key covers: pinned builder image + pinned toolchain file (build
          # environment), the dependency lockfile, and all workspace manifests.
          # rust-toolchain.toml pins an exact channel, so hashing it stands in
          # for the rustc version and lets this restore run before the first
          # rustc invocation, keeping the toolchain warm. The base-devel-...
          # literal must match the `container:` image above and the
          # feature-matrix job below; bump it with rust-toolchain.toml.
          # NOTE: this step must stay the first thing after checkout. Every
          # cargo/rustc use below (tool installs, fmt, clippy, build) hits the
          # warmed toolchain/registry/target instead of refetching. That is
          # what keeps fmt/clippy at seconds instead of minutes.
          key: ${{ runner.os }}-cargo-base-devel-20260818.0.575430-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Install cargo-deb
        # Prebuilt via install-action like the other two. The old
        # `cargo install cargo-deb --locked` fallback compiled from source
        # (~minutes) on every cache miss; this is seconds, always.
        uses: taiki-e/install-action@cargo-deb

      - name: Set version from tag
        run: |
          # On tag pushes, build the tagged release version.
          # On main pushes, use the current PKGBUILD version and skip release publishing.
          PKGVER=${GITHUB_REF_NAME#v}
          if [[ "$PKGVER" == "main" || "$PKGVER" == "$GITHUB_REF_NAME" ]]; then
            PKGVER=$(grep '^pkgver=' PKGBUILD | cut -d= -f2)
          fi
          sed -i "s/^version = \".*\"/version = \"${PKGVER}\"/" Cargo.toml
          echo "PKGVER=${PKGVER}" >> "$GITHUB_ENV"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Audit dependencies
        run: cargo audit

      - name: Build release (bins + tests, single plan)
        # One cargo plan compiles the shippable bins and the test harnesses
        # together. The normal/test lib variants are inherent to shipping a
        # release and testing it, so two invocations only pay cargo's planning
        # pass twice. The nextest step below then finds everything fresh and
        # just runs.
        run: cargo build --release --all-targets

      - name: Test release
        # Bounded test concurrency: nextest runs each test in its own process,
        # and a third of this suite stand up a real libmpv handle or a loopback
        # HTTP/ctrl fixture per test. At full parallelism (== cores) the
        # container blows its fd/thread budget, a fixture helper thread's
        # accept()/connect() unwrap dies, and unrelated assertions fail with
        # misleading messages (`perform_handshake_*`,
        # `active_file_preparation_finalizes_*`,
        # `lifecycle_close_loopback_*`).
        # Reproduced locally with `ulimit -n 512`: 4/20 runs fail unthrottled,
        # 0/15 fail at 4 tests even at `ulimit -n 384`. Costs ~2s.
        run: cargo nextest run --release --test-threads=4

      - name: Bundle release tarball
        run: |
          DIST="mbv-${PKGVER}"
          mkdir -p "${DIST}"
          cp target/release/mbv "${DIST}/"
          cp target/release/mbvd "${DIST}/"
          cp scripts/mbv.lua "${DIST}/"
          cp scripts/mbv_*.lua "${DIST}/"
          cp fonts/Material-Design-Iconic-Font.ttf "${DIST}/"
          cp dist/config.toml "${DIST}/"
          cp dist/mbvd.toml "${DIST}/"
          cp contrib/mbvd.service "${DIST}/"
          cp contrib/mbv.desktop "${DIST}/"
          cp assets/icon.svg "${DIST}/icon.svg"
          tar czf "${DIST}-linux-x86_64.tar.gz" "${DIST}"
          echo "TARBALL=${DIST}-linux-x86_64.tar.gz" >> "$GITHUB_ENV"
          echo "PKGVER=${PKGVER}" >> "$GITHUB_ENV"

      - name: Build .deb package
        run: |
          cargo deb --no-build --deb-version "${PKGVER}"
          cargo deb --no-build --manifest-path crates/mbvd/Cargo.toml --deb-version "${PKGVER}"
          MBV_DEB=$(ls target/debian/mbv_*.deb | head -1)
          MBVD_DEB=$(ls target/debian/mbvd_*.deb | head -1)
          dpkg-deb --field "${MBV_DEB}" Depends | grep -Eq '(^|, )pipewire(,|$)'
          dpkg-deb --field "${MBV_DEB}" Depends | grep -Eq '(^|, )libpipewire-0\.3-0(,|$)'
          dpkg-deb --field "${MBV_DEB}" Depends | grep -Eq '(^|, )libwayland-client0(,|$)'
          dpkg-deb --field "${MBV_DEB}" Depends | grep -Eq '(^|, )libxkbcommon0(,|$)'
          dpkg-deb --field "${MBV_DEB}" Depends | grep -Eq '(^|, )libfontconfig1(,|$)'
          if dpkg-deb --field "${MBVD_DEB}" Depends | grep -Eq '(^|, )(pipewire|libpipewire-0\.3-0)(,|$)'; then
            echo "mbvd must not depend on PipeWire runtime packages"
            exit 1
          fi
          echo "MBV_DEB=${MBV_DEB}" >> "$GITHUB_ENV"
          echo "MBVD_DEB=${MBVD_DEB}" >> "$GITHUB_ENV"

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "v${PKGVER}" > /dev/null 2>&1 || \
            gh release create "v${PKGVER}" --title "v${PKGVER}" --generate-notes
          gh release upload "v${PKGVER}" "${TARBALL}" --clobber
          gh release upload "v${PKGVER}" "${MBV_DEB}" --clobber
          gh release upload "v${PKGVER}" "${MBVD_DEB}" --clobber
          gh release edit "v${PKGVER}" --draft=false

      - name: Commit PKGBUILD with sha256 to main
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        # Non-fatal: retries below handle the common non-fast-forward race (main
        # advanced since checkout on a detached HEAD), but if every retry still
        # loses the race this must not abort the job before the AUR publish
        # trigger step. AUR reads the sha256 from the release asset, not this
        # commit, so a missed PKGBUILD commit is cosmetic and can be redone by
        # hand.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Checkout runs as root in this image, so the repo is root-owned;
          # user steps run as a different uid. Git's safe.directory protection
          # then refuses every command ("dubious ownership"); the exception
          # checkout itself writes lands in a temp HOME, invisible here.
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          SHA256=$(sha256sum "${TARBALL}" | cut -d' ' -f1)
          sed -i "s/^pkgver=.*/pkgver=${PKGVER}/" PKGBUILD
          sed -i "s/^sha256sums=.*/sha256sums=('${SHA256}')/" PKGBUILD
          git config user.name "mbv release"
          git config user.email "github@poo.town"
          git add PKGBUILD
          if git diff --staged --quiet; then
            exit 0
          fi
          git commit -m "chore: update PKGBUILD to v${PKGVER}"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push rejected (attempt ${attempt}), rebasing onto latest main" >&2
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
          done
          exit 1

      - name: Trigger AUR publish
        # Fire-and-forget: AUR publishing runs in its own workflow (aur.yml)
        # from the published release, so an AUR failure can never fail this
        # build, and publishing can be retried by dispatching aur.yml manually.
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run aur.yml -f version="${PKGVER}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: mbv-linux-x86_64
          path: |
            *.tar.gz
            target/debian/mbv_*.deb
            target/debian/mbvd_*.deb
          if-no-files-found: error

  feature-matrix:
    # cargo-hack feature-matrix gate (issue #888). A separate parallel job,
    # not a step in `build`: --each-feature re-checks the workspace once per
    # feature, and that cost must never sit on the release critical path.
    runs-on: ubuntu-latest
    # Same pinned builder image as `build` (keep the literal in sync with the
    # container above and with the cache key below): `cargo check` still runs
    # every build script, so this job needs the same makedeps and the same
    # toolchain pin from rust-toolchain.toml.
    container: archlinux/archlinux:base-devel-20260818.0.575430
    permissions:
      contents: read

    steps:
      # Same makedeps as `build`: check runs build scripts (pkg-config probes
      # for mpv/pipewire/openssl), and checkout needs git for a real clone (see
      # the comment on the matching step in `build`).
      - name: Update system and install makedeps
        run: |
          pacman_retry() {
            for attempt in 1 2 3; do
              "$@" && return 0
              pacman -Syy --noconfirm
              sleep $((attempt * 10))
            done
            "$@"
          }
          pacman_retry pacman -Syu --noconfirm
          pacman_retry pacman -S --noconfirm --needed rustup clang nasm mpv pipewire openssl dpkg github-cli git openssh zig wayland libxkbcommon fontconfig

      - uses: actions/checkout@v7

      - name: Cache Rust build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            ~/.cargo/advisory-db
            ~/.rustup/toolchains
            target
          # Own key family (`hack-`, deliberately not under `build`'s
          # `cargo-` restore-keys prefix): otherwise whichever job saves last
          # wins the shared key, and the release build could restore this
          # job's check-only target instead of its own release warmness. Same
          # hashFiles inputs as `build`; the base-devel literal must match the
          # `container:` image above.
          key: ${{ runner.os }}-hack-base-devel-20260818.0.575430-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-hack-

      - name: Install cargo-hack
        uses: taiki-e/install-action@cargo-hack

      - name: Check feature matrix
        # `--each-feature`, not `--feature-powerset`: the 12+ `test` features
        # are additive shims and a powerset over them is combinatorial and
        # unjustified. `--all-targets` is required, not cosmetic: a plain
        # `cargo hack check` builds libs only and never activates the
        # dev-dependency-enabled `test` features, so without it the gate would
        # skip the configuration the workspace actually builds.
        run: cargo hack check --each-feature --workspace --all-targets
