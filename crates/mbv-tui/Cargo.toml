[package]
name = "mbv-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "mpv/Emby and Audiobookshelf front-end"
readme = "../../README.md"
default-run = "mbv"

[[bin]]
name = "mbv"
path = "src/main.rs"

# Lints mirror [workspace.lints] in the root Cargo.toml, minus the
# print_stdout/print_stderr terminal-write restriction lints (issue #908):
# the `mbv` TUI binary is the terminal's writer — it prints usage, version,
# and error/crash notices before the shell owns the screen. Cargo rejects
# `workspace = true` combined with per-crate overrides, so this must stay a
# full copy. Grep for this header to keep each copy in sync with the root
# block.
[lints.clippy]
mod_module_files = "deny"
# Cannot be overridden by an inline allow/expect: params structs, not
# suppressions (issue #809).
too_many_arguments = "forbid"
cognitive_complexity = "warn"
excessive_nesting = "warn"
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
# nursery = { level = "warn", priority = -1 }  # optional, might cause more false positives
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
map_err_ignore = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
semicolon_outside_block = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"
# May cause issues with structured logging otherwise.
literal_string_with_formatting_args = "allow"
# Transitive dependency version skew (thiserror, getrandom, zbus family, etc.) —
# no source fix exists; converges as upstreams update (issue #804).
multiple_crate_versions = { level = "allow" }
# No rustdoc is published and the flagged fns are only reachable by same-repo
# path-dependency siblings, so hand-written `# Errors` sections would be filler
# (resolve-clippy-doc-lints / issue #816).
missing_errors_doc = { level = "allow" }

[lints.rust]
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

# Exposes the test fixtures and test-only seams the TUI tests drive; the
# shipped builds never enable it.
[features]
test = [
    "mbv-client-core/test",
    "mbv-config/test",
    "mbv-emby/test",
    "mbv-emby-model/test",
    "mbv-images/test",
    "mbv-remote-player/test",
]

[dependencies]
mbv-audiobookshelf = { path = "../mbv-audiobookshelf" }
mbv-cast = { path = "../mbv-cast" }
mbv-client-core = { path = "../mbv-client-core" }
mbv-components = { path = "../mbv-components" }
mbv-config = { path = "../mbv-config" }
mbv-core = { path = "../mbv-core" }
mbv-ctrl = { path = "../mbv-ctrl" }
mbv-daemon = { path = "../mbv-daemon" }
mbv-desktop = { path = "../mbv-desktop" }
mbv-emby = { path = "../mbv-emby" }
mbv-emby-model = { path = "../mbv-emby-model" }
mbv-feed = { path = "../mbv-feed" }
mbv-ids = { path = "../mbv-ids" }
mbv-images = { path = "../mbv-images" }
mbv-keybinds = { path = "../mbv-keybinds" }
mbv-net = { path = "../mbv-net" }
mbv-player = { path = "../mbv-player" }
mbv-queue = { path = "../mbv-queue" }
mbv-remote-player = { path = "../mbv-remote-player" }
mbv-render = { path = "../mbv-render" }
mbv-surfaces = { path = "../mbv-surfaces" }
mbv-theme = { path = "../mbv-theme" }
mbv-tui-support = { path = "../mbv-tui-support" }
mbv-ui-model = { path = "../mbv-ui-model" }
mbv-ui-msg = { path = "../mbv-ui-msg" }
mbv-visualizer = { path = "../mbv-visualizer" }
crossterm.workspace = true
image = { workspace = true, features = ["jpeg", "png", "gif", "webp", "bmp"] }
libc.workspace = true
mimalloc.workspace = true
ratatui.workspace = true
ratatui-image = { workspace = true, features = ["crossterm"] }
serde_json.workspace = true
time = { workspace = true, features = ["local-offset"] }
tracing.workspace = true
tui-scrollbar.workspace = true
tuirealm.workspace = true

[dev-dependencies]
# The `test` feature exposes the core's stub fixtures and test seams. It is a
# dev dependency only: no shipped build enables it (design D4e).
mbv-client-core = { path = "../mbv-client-core", features = ["test"] }
mbv-ui-msg = { path = "../mbv-ui-msg", features = ["test"] }
mbv-cast = { path = "../mbv-cast", features = ["test"] }
mbv-images = { path = "../mbv-images", features = ["test"] }
mbv-core = { path = "../mbv-core" }
mbv-remote-player = { path = "../mbv-remote-player", features = ["test"] }
mbv-player = { path = "../mbv-player", features = ["test"] }
mbv-config = { path = "../mbv-config", features = ["test"] }
mbv-net = { path = "../mbv-net", features = ["test"] }
mbv-emby-model = { path = "../mbv-emby-model", features = ["test"] }
mbv-emby = { path = "../mbv-emby", features = ["test"] }
mbv-ui-model = { path = "../mbv-ui-model", features = ["test"] }
mbv-render = { path = "../mbv-render", features = ["test"] }
mbv-components = { path = "../mbv-components", features = ["test"] }
mbv-tui-support = { path = "../mbv-tui-support", features = ["test"] }
uuid = { workspace = true, features = ["v4", "fast-rng"] }
rstest.workspace = true

[package.metadata.deb]
# The .deb keeps the `mbv` package name (not the crate name): it ships the
# `mbv`, `mbv-gui`, and `mbv-owner` binaries, and the release workflow uploads
# `target/debian/mbv_*.deb`.
name = "mbv"
maintainer = "slatkin <slatkin@gmail.com>"
copyright = "2024, slatkin"
license-file = ["../../LICENSE", "0"]
extended-description = "mpv/Emby and Audiobookshelf front-end. Runs mpv in a child process for playback, syncs position with Emby, and supports full remote control via Emby's websocket API."
depends = "mpv, libc6, pipewire, libpipewire-0.3-0, libwayland-client0, libxkbcommon0, libxkbcommon-x11-0, libxcb1, libx11-6, libfontconfig1, libvulkan1"
section = "video"
priority = "optional"
assets = [
    ["../../target/release/mbv", "usr/bin/mbv", "755"],
    ["../../target/release/mbv-gui", "usr/bin/mbv-gui", "755"],
    ["../../target/release/mbv-owner", "usr/bin/mbv-owner", "755"],
    ["../../contrib/mbv.desktop", "usr/share/applications/mbv.desktop", "644"],
    ["../../assets/icon.svg", "usr/share/icons/hicolor/scalable/apps/mbv.svg", "644"],
    ["../../scripts/mbv.lua", "usr/share/mbv/scripts/mbv.lua", "644"],
    ["../../scripts/mbv_state.lua", "usr/share/mbv/scripts/mbv_state.lua", "644"],
    ["../../scripts/mbv_helpers.lua", "usr/share/mbv/scripts/mbv_helpers.lua", "644"],
    ["../../scripts/mbv_render.lua", "usr/share/mbv/scripts/mbv_render.lua", "644"],
    ["../../scripts/mbv_options.lua", "usr/share/mbv/scripts/mbv_options.lua", "644"],
    ["../../scripts/mbv_lifecycle.lua", "usr/share/mbv/scripts/mbv_lifecycle.lua", "644"],
    ["../../scripts/mbv_events.lua", "usr/share/mbv/scripts/mbv_events.lua", "644"],
    ["../../scripts/mbv_visibility.lua", "usr/share/mbv/scripts/mbv_visibility.lua", "644"],
    ["../../scripts/mbv_intro.lua", "usr/share/mbv/scripts/mbv_intro.lua", "644"],
    ["../../fonts/Material-Design-Iconic-Font.ttf", "usr/share/mbv/fonts/Material-Design-Iconic-Font.ttf", "644"],
    ["../../dist/config.toml", "usr/share/mbv/config.toml", "644"],
    ["../../LICENSES/MPL-2.0.txt", "usr/share/doc/mbv/LICENSES/MPL-2.0.txt", "644"],
    ["../mbv-gui/assets/fonts/ibm-plex-sans-OFL-1.1.txt", "usr/share/doc/mbv/LICENSES/ibm-plex-sans-OFL-1.1.txt", "644"],
    ["../mbv-gui/assets/fonts/jetbrains-mono-OFL-1.1.txt", "usr/share/doc/mbv/LICENSES/jetbrains-mono-OFL-1.1.txt", "644"],
    ["../mbv-gui/assets/vendor/lucide-ISC.txt", "usr/share/doc/mbv/LICENSES/lucide-ISC.txt", "644"],
    ["../mbv-gui/assets/vendor/shadcn-svelte-MIT.txt", "usr/share/doc/mbv/LICENSES/shadcn-svelte-MIT.txt", "644"],
    ["../mbv-gui/assets/vendor/tw-animate-css-MIT.txt", "usr/share/doc/mbv/LICENSES/tw-animate-css-MIT.txt", "644"],
]
