[package]
name = "mbv-cast"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Google Cast discovery and playback integration for mbv."
readme = "../../README.md"

[lints]
workspace = true

[dependencies]
mbv-audiobookshelf = { path = "../mbv-audiobookshelf" }
mbv-queue = { path = "../mbv-queue" }
serde_json.workspace = true
rust_cast = "0.21"
mdns-sd = { version = "0.21", default-features = false, features = ["log"] }
tracing.workspace = true

[dev-dependencies]
# mdns-sd's `Receiver<ServiceEvent>` is a `flume` channel; tests construct one
# directly to feed synthetic events into cast_discovery's pure collection
# logic without a real mDNS browse.
flume = "0.12"
rstest.workspace = true
