[package]
name = "mbv-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
test-support = []

[dependencies]
ureq.workspace = true
percent-encoding.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
redb.workspace = true
native-tls.workspace = true
libmpv2.workspace = true
libmpv2-sys.workspace = true
rand.workspace = true
uuid.workspace = true
tungstenite.workspace = true
log.workspace = true
libc.workspace = true
rust_cast = "0.21"
mdns-sd = { version = "0.21", default-features = false, features = ["log"] }

[dev-dependencies]
# mdns-sd's `Receiver<ServiceEvent>` is a `flume` channel; tests construct one
# directly to feed synthetic events into cast_discovery's pure collection
# logic without a real mDNS browse.
flume = "0.12"
