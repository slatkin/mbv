mbv-config = { path = "../mbv-config" }
mbv-audiobookshelf = { path = "../mbv-audiobookshelf" }
mbv-cast = { path = "../mbv-cast" }
mbv-ws = { path = "../mbv-ws" }
ureq.workspace = true
serde.workspace = true
serde_json.workspace = true
libmpv2.workspace = true
libmpv2-sys.workspace = true
rand.workspace = true
uuid.workspace = true
tungstenite.workspace = true
log.workspace = true
libc.workspace = true
time.workspace = true

[dev-dependencies]
rust_cast = "0.21"
rstest.workspace = true
