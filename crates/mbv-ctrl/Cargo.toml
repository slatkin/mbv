[package]
name = "mbv-ctrl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Control protocol and Player vocabulary for mbv."
readme = "../../README.md"

[lints]
workspace = true

[dependencies]
mbv-queue = { path = "../mbv-queue" }
mbv-emby-model = { path = "../mbv-emby-model" }
mbv-ids = { path = "../mbv-ids" }
serde = { workspace = true, features = ["derive"] }
schemars.workspace = true

[dev-dependencies]
# Fixture-vs-schema validation for the ctrl protocol conformance gate.
# Default features are off: they pull HTTP/file reference resolvers (reqwest,
# TLS) this gate never needs — every fixture schema resolves locally.
jsonschema = { version = "0.60", default-features = false }
rstest.workspace = true
serde_json.workspace = true
# Enum iteration for the conformance fixture tables: a shape enum variant
# missing from a hand-kept list plus a missing fixture passes silently, so
# every coverage list is built by iteration.
strum = { version = "0.28", features = ["derive"] }
