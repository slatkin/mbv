[package]
name = "mbv-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Native window Client for mbv, built with Tauri 2."
readme = "../../README.md"

[lints]
workspace = true

# Exact pins per openspec/changes/add-tauri-gui-client/design.md D2.
[dependencies]
mbv = { path = "../.." }
mbv-config = { path = "../mbv-config" }
mbv-core = { path = "../mbv-core" }
mbv-daemon = { path = "../mbv-daemon" }
# The scrubber hover preview resolves the pointer fraction to the Emby
# tick position it names (the `ticks_to_seconds`/`seconds_to_ticks` pair).
mbv-emby-model = { path = "../mbv-emby-model" }
mbv-images = { path = "../mbv-images" }
mbv-queue = { path = "../mbv-queue" }
mbv-remote-player = { path = "../mbv-remote-player" }
mbv-surfaces = { path = "../mbv-surfaces" }
mbv-text = { path = "../mbv-text" }
mbv-theme = { path = "../mbv-theme" }
mbv-ui-model = { path = "../mbv-ui-model" }
mbv-ui-msg = { path = "../mbv-ui-msg" }
mimalloc.workspace = true
serde = { workspace = true, features = ["derive"] }
tauri = "=2.12.5"
tracing.workspace = true

[build-dependencies]
tauri-build = "=2.7.4"

[dev-dependencies]
mbv = { path = "../..", features = ["test"] }
# The core-thread tests assert the ctrl commands a selection or transport
# request records on the stub player's command channel.
mbv-ctrl = { path = "../mbv-ctrl" }
# The startup tests build the attach's cached client and answer its Emby
# requests from the in-memory mock transport, so no request leaves the
# process.
mbv-emby = { path = "../mbv-emby" }
mbv-net = { path = "../mbv-net", features = ["test"] }
# The core-thread test seeds the card image cache with a decoded image.
image = { workspace = true, features = ["png"] }
rstest.workspace = true
serde_json.workspace = true
# The `sections` bench times one core step per fixture (design D12 of
# `gui-change-driven-sections`); it runs only on a manual `cargo bench`.
criterion = { workspace = true }

[[bench]]
name = "sections"
harness = false
