[package]
name = "mbv-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "GUI Client program for mbv: one native window over the shared Client core."
readme = "../../README.md"

[[bin]]
name = "mbv-gui"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
mbv = { path = "../.." }
mbv-surfaces = { path = "../mbv-surfaces" }
mbv-theme = { path = "../mbv-theme" }
mbv-ui-model = { path = "../mbv-ui-model" }
mbv-ui-msg = { path = "../mbv-ui-msg" }
mbv-queue = { path = "../mbv-queue" }
mbv-emby-model = { path = "../mbv-emby-model" }
# eframe 0.37 with the D8 feature list (design D8 of `add-gui-front-end`).
# Default features are off, so the list stays explicit. `wayland` and `x11`
# are the window backends. `glow` is named because eframe 0.34 made wgpu the
# default renderer; do not add `wgpu`. `system_fonts` lets egui fall back to
# installed fonts for glyphs the bundled fonts lack.
eframe = { version = "0.37.0", default-features = false, features = ["glow", "wayland", "x11", "default_fonts", "clipboard", "links", "accesskit", "system_fonts"] }

[dev-dependencies]
rstest.workspace = true
# The headless GUI tests build their `App` from the root package's stub
# construction (`mbv::stub_app`, design D11 of `add-gui-front-end`).
mbv = { path = "../..", features = ["test"] }
# The isolation test reads the state and config directories through the
# mbv-config API (U17 re-review). The `test` feature above enables its guard.
mbv-config = { path = "../mbv-config" }
