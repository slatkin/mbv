[package]
name = "mbv-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Native window Client for mbv, built with Dioxus Native on Blitz."
readme = "../../README.md"

[[bin]]
name = "mbv-gui"
path = "src/main.rs"

[lints]
workspace = true

# Exact pins per openspec/changes/replace-tauri-with-blitz/design.md D2.
[dependencies]
mbv = { path = "../.." }
mbv-config = { path = "../mbv-config" }
mbv-core = { path = "../mbv-core" }
mbv-daemon = { path = "../mbv-daemon" }
# The scrubber hover preview resolves the pointer fraction to the Emby
# tick position it names (the `ticks_to_seconds`/`seconds_to_ticks` pair).
mbv-emby-model = { path = "../mbv-emby-model" }
mbv-images = { path = "../mbv-images" }
mbv-queue = { path = "../mbv-queue" }
mbv-remote-player = { path = "../mbv-remote-player" }
mbv-surfaces = { path = "../mbv-surfaces" }
mbv-text = { path = "../mbv-text" }
mbv-theme = { path = "../mbv-theme" }
mbv-ui-model = { path = "../mbv-ui-model" }
mbv-ui-msg = { path = "../mbv-ui-msg" }
mimalloc.workspace = true
tracing.workspace = true

# The window dependencies (replace-tauri-with-blitz design D2): exact pins on
# the dioxus-native/Blitz stack, with the peer pins D2 records held so Cargo
# unifies one copy of blitz-dom and parley. The `blitz` feature is gone at the
# switch (D18): these are the only window stack.
#
# Tokio: `dioxus-native` enables `tokio` (rt) through `dioxus-asset-resolver`'s
# `native` feature, with no switch; no mbv code uses a tokio API (the
# AGENTS.md tokio edge list names this crate for that resolver).
#
# Licence: Stylo and the other Servo crates in the Blitz stack are MPL-2.0;
# the packages ship the MPL notice and name the crates.io source as the
# source offer (design D17).
dioxus-native = { version = "=0.8.0-alpha.3", default-features = false, features = [
  "prelude",
  "svg",
  "system-fonts",
  "woff",
  "vello-hybrid",
] }
blitz-shell = { version = "=0.3.0-beta.4", default-features = false }
blitz-traits = { version = "=0.3.0-beta.4", default-features = false }
# `decode_font_bytes` for the ellipsis fonts (D12) and the `Document` trait in
# the headless tests.
blitz-dom = { version = "=0.3.0-beta.4", default-features = false, features = ["woff"] }
# The ellipsis measure (D12); the same version as Blitz, so Cargo unifies one copy.
parley = { version = "=0.12.0", default-features = false, features = ["std"] }
# The window channel (D4).
futures-channel = { version = "=0.3.34" }
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
# Art headers for the natural size (D7).
image = { workspace = true, features = ["png", "jpeg", "webp"] }
# Grapheme boundaries for the ellipsis cut (D12).
unicode-segmentation = { version = "1.13" }
# The Dioxus event data's f64 coordinates and wheel deltas narrow to the wire
# `DomPointer`'s f32 through num-traits' checked cast (D8), which the blitz
# tree already carries.
num-traits = { version = "0.2", default-features = false }
# The playhead's wall clocks and the local zone they paint in (D10): the
# workspace `time` crate the TUI's projections share, with `local-offset` for
# the window's own zone.
time = { workspace = true, features = ["local-offset"] }

[dev-dependencies]
mbv = { path = "../..", features = ["test"] }
# The painted svg tree the headless tests read: Blitz parses an inline `svg`
# with usvg, so a test that asserts what the painter paints reads that tree.
# The same version Blitz parses with, default features off so Cargo unifies
# the copy the window stack already builds.
usvg = { version = "=0.50.0", default-features = false }
# The core-thread tests assert the ctrl commands a selection or transport
# request records on the stub player's command channel.
mbv-ctrl = { path = "../mbv-ctrl" }
# The startup tests build the attach's cached client and answer its Emby
# requests from the in-memory mock transport, so no request leaves the
# process.
mbv-emby = { path = "../mbv-emby" }
mbv-net = { path = "../mbv-net", features = ["test"] }
# The paint recorder the headless frame test reads: the window paints a frame
# by pushing `anyrender` drawing commands out of `blitz_paint::paint_scene`,
# so a test records one frame as those commands and reads its geometry. The
# versions are the window stack's own (`Cargo.lock`), and `blitz-paint`'s
# `svg` feature is the one the window builds with.
blitz-paint = { version = "=0.3.0-beta.4" }
anyrender = { version = "=0.14.0" }
kurbo = { version = "=0.13.1" }
rstest.workspace = true
# The `sections` bench times one core step per fixture (design D12 of
# `gui-change-driven-sections`); it runs only on a manual `cargo bench`.
criterion = { workspace = true }

[[bench]]
name = "sections"
harness = false
