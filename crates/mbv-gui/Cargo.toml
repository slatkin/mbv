[package]
name = "mbv-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Native window Client for mbv, built with Tauri 2."
readme = "../../README.md"

[features]
default = ["tauri", "blitz"]
tauri = ["dep:tauri"]
# The D2 window dependencies (replace-tauri-with-blitz design D2).
blitz = [
  "dep:dioxus-native",
  "dep:blitz-shell",
  "dep:blitz-traits",
  "dep:blitz-dom",
  "dep:parley",
  "dep:futures-channel",
  "dep:futures-util",
  "dep:image",
]

[[bin]]
name = "mbv-gui"
path = "src/main.rs"
required-features = ["tauri"]

[[bin]]
name = "mbv-gui-blitz"
path = "src/bin/mbv_gui_blitz.rs"
required-features = ["blitz"]

[lints]
workspace = true

# Exact pins per openspec/changes/add-tauri-gui-client/design.md D2.
[dependencies]
mbv = { path = "../.." }
mbv-config = { path = "../mbv-config" }
mbv-core = { path = "../mbv-core" }
mbv-daemon = { path = "../mbv-daemon" }
# The scrubber hover preview resolves the pointer fraction to the Emby
# tick position it names (the `ticks_to_seconds`/`seconds_to_ticks` pair).
mbv-emby-model = { path = "../mbv-emby-model" }
mbv-images = { path = "../mbv-images" }
mbv-queue = { path = "../mbv-queue" }
mbv-remote-player = { path = "../mbv-remote-player" }
mbv-surfaces = { path = "../mbv-surfaces" }
mbv-text = { path = "../mbv-text" }
mbv-theme = { path = "../mbv-theme" }
mbv-ui-model = { path = "../mbv-ui-model" }
mbv-ui-msg = { path = "../mbv-ui-msg" }
mimalloc.workspace = true
serde = { workspace = true, features = ["derive"] }
tauri = { version = "=2.12.5", optional = true }
tracing.workspace = true

# The D2 window dependencies (replace-tauri-with-blitz design D2): exact pins
# on the dioxus-native/Blitz stack, with the peer pins D2 records held so
# Cargo unifies one copy of blitz-dom and parley.
dioxus-native = { version = "=0.8.0-alpha.3", optional = true, default-features = false, features = [
  "prelude",
  "svg",
  "system-fonts",
  "woff",
  "vello-hybrid",
] }
blitz-shell = { version = "=0.3.0-beta.4", optional = true, default-features = false }
blitz-traits = { version = "=0.3.0-beta.4", optional = true, default-features = false }
# `decode_font_bytes` for the ellipsis fonts (D12) and the `Document` trait in
# the headless tests.
blitz-dom = { version = "=0.3.0-beta.4", optional = true, default-features = false, features = ["woff"] }
# The ellipsis measure (D12); the same version as Blitz, so Cargo unifies one copy.
parley = { version = "=0.12.0", optional = true, default-features = false, features = ["std"] }
# The window channel (D4).
futures-channel = { version = "=0.3.34", optional = true }
futures-util = { version = "=0.3.34", optional = true, default-features = false, features = ["std"] }
# Art headers for the natural size (D7).
image = { workspace = true, optional = true, features = ["png", "jpeg", "webp"] }

[build-dependencies]
tauri-build = "=2.7.4"

[dev-dependencies]
mbv = { path = "../..", features = ["test"] }
# The core-thread tests assert the ctrl commands a selection or transport
# request records on the stub player's command channel.
mbv-ctrl = { path = "../mbv-ctrl" }
# The startup tests build the attach's cached client and answer its Emby
# requests from the in-memory mock transport, so no request leaves the
# process.
mbv-emby = { path = "../mbv-emby" }
mbv-net = { path = "../mbv-net", features = ["test"] }
# The core-thread test seeds the card image cache with a decoded image.
image = { workspace = true, features = ["png"] }
rstest.workspace = true
serde_json.workspace = true
# The `sections` bench times one core step per fixture (design D12 of
# `gui-change-driven-sections`); it runs only on a manual `cargo bench`.
criterion = { workspace = true }

[[bench]]
name = "sections"
harness = false
