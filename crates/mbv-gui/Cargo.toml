[package]
name = "mbv-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "GUI Client program for mbv: one native window over the shared Client core."
readme = "../../README.md"

[[bin]]
name = "mbv-gui"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
mbv = { path = "../.." }
mbv-surfaces = { path = "../mbv-surfaces" }
mbv-theme = { path = "../mbv-theme" }
mbv-ui-model = { path = "../mbv-ui-model" }
mbv-ui-msg = { path = "../mbv-ui-msg" }
mbv-queue = { path = "../mbv-queue" }
mbv-emby-model = { path = "../mbv-emby-model" }
# eframe's default features are the glow (OpenGL) renderer plus the Wayland
# and X11 backends (design D8 of `add-gui-front-end`). Do not add `wgpu`.
eframe = "0.33"

[dev-dependencies]
rstest.workspace = true
# The headless GUI tests build their `App` from the root package's stub
# construction (`mbv::stub_app`, design D11 of `add-gui-front-end`).
mbv = { path = "../..", features = ["test"] }
# The isolation test reads the state and config directories through the
# mbv-config API (U17 re-review). The `test` feature above enables its guard.
mbv-config = { path = "../mbv-config" }
