[package]
name = "mbv-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Daemon runtime for mbv media playback."
readme = "../../README.md"

[lints]
workspace = true

[dependencies]
mbv-core = { path = "../mbv-core" }
mbv-player = { path = "../mbv-player" }
mbv-emby = { path = "../mbv-emby" }
mbv-emby-model = { path = "../mbv-emby-model" }
mbv-audiobookshelf = { path = "../mbv-audiobookshelf" }
mbv-ctrl = { path = "../mbv-ctrl" }
mbv-config = { path = "../mbv-config" }
mbv-queue = { path = "../mbv-queue" }
mbv-ids = { path = "../mbv-ids" }
mbv-net = { path = "../mbv-net" }
mbv-ws = { path = "../mbv-ws" }
libc.workspace = true
nix = { workspace = true, features = ["fs", "signal", "socket"] }
uuid = { workspace = true, features = ["v4", "fast-rng"] }
serde_json.workspace = true
tracing.workspace = true

[dev-dependencies]
mbv-core = { path = "../mbv-core", features = ["test"] }
tracing-subscriber.workspace = true
rstest.workspace = true
mbv-player = { path = "../mbv-player", features = ["test"] }
mbv-config = { path = "../mbv-config", features = ["test"] }
mbv-net = { path = "../mbv-net", features = ["test"] }
