[package]
name = "mbvd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Daemon process for mbv media playback."
readme = "../../README.md"

[[bin]]
name = "mbvd"
path = "src/main.rs"

# Lints mirror [workspace.lints] in the root Cargo.toml, minus the
# print_stdout/print_stderr terminal-write restriction lints (issue #908):
# `mbvd`'s stdout/stderr are its CLI answers and the systemd journal channel;
# it is a headless package, not a library below the shell. Cargo rejects
# `workspace = true` combined with per-crate overrides, so this must stay a
# full copy. Grep for this header to keep each copy in sync with the root
# block. `dbg!` is forbidden separately in clippy.toml (`disallowed-macros`,
# issue #923). Direct `io::stdout()`/`io::stderr()` writes from library crates
# outside this package are sanctioned only for the applog stderr sink and
# failure notice (mbv-core) and the palette.json maintainer hint (mbv-theme).
[lints.clippy]
mod_module_files = "deny"
# Cannot be overridden by an inline allow/expect: params structs, not
# suppressions (issue #809).
too_many_arguments = "forbid"
cognitive_complexity = "warn"
excessive_nesting = "warn"
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
# nursery = { level = "warn", priority = -1 }  # optional, might cause more false positives
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
map_err_ignore = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
semicolon_outside_block = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"
# May cause issues with structured logging otherwise.
literal_string_with_formatting_args = "allow"
# Transitive dependency version skew (thiserror, getrandom, zbus family, etc.) —
# no source fix exists; converges as upstreams update (issue #804).
multiple_crate_versions = { level = "allow" }
# No rustdoc is published and the flagged fns are only reachable by same-repo
# path-dependency siblings, so hand-written `# Errors` sections would be filler
# (resolve-clippy-doc-lints / issue #816).
missing_errors_doc = { level = "allow" }

[lints.rust]
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[dependencies]
mbv-emby = { path = "../mbv-emby" }
mbv-core = { path = "../mbv-core" }
mbv-daemon = { path = "../mbv-daemon" }
mbv-audiobookshelf = { path = "../mbv-audiobookshelf" }
mbv-queue = { path = "../mbv-queue" }
mbv-ctrl = { path = "../mbv-ctrl" }
mbv-config = { path = "../mbv-config" }
libc.workspace = true
tracing.workspace = true
mimalloc.workspace = true
nix = { workspace = true, features = ["term"] }
serde_json.workspace = true

[dev-dependencies]
mbv-config = { path = "../mbv-config", features = ["test"] }

[package.metadata.deb]
maintainer = "slatkin <slatkin@gmail.com>"
copyright = "2024, slatkin"
license-file = ["../../LICENSE", "0"]
extended-description = "Daemon process for mbv media playback. Syncs position with Emby and supports remote control over Emby's websocket API. Requires an x86-64-v2 CPU (about 2009 or newer)."
depends = "libmpv2 | libmpv1, libc6, libssl3 | libssl1.1"
section = "video"
priority = "optional"
assets = [
    ["target/release/mbvd", "usr/bin/mbvd", "755"],
    ["../../contrib/mbvd.service", "lib/systemd/system/mbvd.service", "644"],
    ["../../dist/mbvd.toml", "etc/mbv/config.toml", "640"],
]
