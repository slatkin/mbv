[workspace]
members = ["crates/mbv-core", "crates/mbv-ids", "crates/mbv-keybinds", "crates/mbv-net", "crates/mbv-ws", "crates/mbv-text", "crates/mbv-theme", "crates/mbv-images", "crates/mbv-ui-model", "crates/mbv-ui-msg", "crates/mbv-render", "crates/mbv-components", "crates/mbv-emby-model", "crates/mbv-queue", "crates/mbv-ctrl", "crates/mbv-config", "crates/mbv-feed", "crates/mbv-audiobookshelf", "crates/mbv-cast", "crates/mbv-emby", "crates/mbv-remote-player", "crates/mbv-player", "crates/mbv-daemon", "crates/mbv-visualizer", "crates/mbv-desktop", "crates/mbvd"]
default-members = [".", "crates/mbv-core", "crates/mbv-ids", "crates/mbv-keybinds", "crates/mbv-net", "crates/mbv-ws", "crates/mbv-text", "crates/mbv-theme", "crates/mbv-images", "crates/mbv-ui-model", "crates/mbv-ui-msg", "crates/mbv-render", "crates/mbv-components", "crates/mbv-emby-model", "crates/mbv-queue", "crates/mbv-ctrl", "crates/mbv-config", "crates/mbv-feed", "crates/mbv-audiobookshelf", "crates/mbv-cast", "crates/mbv-emby", "crates/mbv-remote-player", "crates/mbv-player", "crates/mbv-daemon", "crates/mbv-visualizer", "crates/mbv-desktop", "crates/mbvd"]

[workspace.package]
version = "0.23.9"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/slatkin/mbv"
keywords = ["emby", "tui", "media-player", "audiobookshelf", "terminal"]
categories = ["command-line-utilities", "multimedia::audio", "multimedia::video"]

[workspace.dependencies]
ureq = { version = "3", default-features = false, features = ["json", "native-tls"] }
native-tls = "0.2"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
libmpv2 = "6"
libmpv2-sys = "4"
rand = "0.10"
uuid = { version = "1", features = ["v4", "fast-rng"] }
tungstenite = { version = "0.30", features = ["native-tls"] }
log = "0.4"
libc = "0.2"
mimalloc = "0.1"
pipewire = "0.10.1"
nix = { version = "0.31", features = ["fs", "process", "signal", "term", "socket"] }
rstest = { version = "0.27", default-features = false }
fuzzy-matcher = "0.3"
time = { version = "0.3", features = ["parsing", "formatting", "local-offset", "macros"] }
tracing = "0.1.44"
ratatui = "0.30"
crossterm = "0.29"
tuirealm = "4.1"
textwrap = { version = "0.16", default-features = false, features = ["unicode-width"] }
ratatui-image = { version = "11", default-features = false, features = ["crossterm"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
unicode-width = "0.2.2"
tui-scrollbar = "0.2.7"

[workspace.lints.clippy]
mod_module_files = "deny"
# Cannot be overridden by an inline allow/expect: params structs, not
# suppressions (issue #809).
too_many_arguments = "forbid"
cognitive_complexity = "warn"
excessive_nesting = "warn"
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
# nursery = { level = "warn", priority = -1 }  # optional, might cause more false positives
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
map_err_ignore = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
semicolon_outside_block = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"
# May cause issues with structured logging otherwise.
literal_string_with_formatting_args = "allow"
# Transitive dependency version skew (thiserror, getrandom, zbus family, etc.) —
# no source fix exists; converges as upstreams update (issue #804).
multiple_crate_versions = { level = "allow" }
# No rustdoc is published and the flagged fns are only reachable by same-repo
# path-dependency siblings, so hand-written `# Errors` sections would be filler
# (resolve-clippy-doc-lints / issue #816).
missing_errors_doc = { level = "allow" }

[workspace.lints.rust]
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

