[workspace]
# The workspace has no root package, so it states the resolver its edition-2024
# members imply explicitly; the default would otherwise drop to version 1.
resolver = "3"
members = ["crates/mbv-core", "crates/mbv-ids", "crates/mbv-keybinds", "crates/mbv-net", "crates/mbv-ws", "crates/mbv-text", "crates/mbv-theme", "crates/mbv-images", "crates/mbv-tui-support", "crates/mbv-ui-model", "crates/mbv-ui-msg", "crates/mbv-surfaces", "crates/mbv-render", "crates/mbv-components", "crates/mbv-emby-model", "crates/mbv-queue", "crates/mbv-ctrl", "crates/mbv-config", "crates/mbv-feed", "crates/mbv-audiobookshelf", "crates/mbv-cast", "crates/mbv-emby", "crates/mbv-remote-player", "crates/mbv-player", "crates/mbv-daemon", "crates/mbv-visualizer", "crates/mbv-desktop", "crates/mbvd", "crates/mbv-client-core", "crates/mbv-tui", "crates/mbv-owner", "crates/mbv-gui"]
# mbv-gui is a member but not a default member, so default builds and nextest
# runs skip its Dioxus Native and Blitz window stack.
default-members = ["crates/mbv-tui", "crates/mbv-core", "crates/mbv-ids", "crates/mbv-keybinds", "crates/mbv-net", "crates/mbv-ws", "crates/mbv-text", "crates/mbv-theme", "crates/mbv-images", "crates/mbv-tui-support", "crates/mbv-ui-model", "crates/mbv-ui-msg", "crates/mbv-surfaces", "crates/mbv-render", "crates/mbv-components", "crates/mbv-emby-model", "crates/mbv-queue", "crates/mbv-ctrl", "crates/mbv-config", "crates/mbv-feed", "crates/mbv-audiobookshelf", "crates/mbv-cast", "crates/mbv-emby", "crates/mbv-remote-player", "crates/mbv-player", "crates/mbv-daemon", "crates/mbv-visualizer", "crates/mbv-desktop", "crates/mbvd", "crates/mbv-client-core", "crates/mbv-owner"]

[workspace.package]
version = "0.29.0"
edition = "2024"
# MSRV policy (M-MSRV): a few minors behind the rust-toolchain.toml pin. Bump
# alongside a pin bump, never independently, and verify with an installed
# toolchain of exactly this version (cargo +<version> check --workspace
# --all-targets) before committing the bump. Bumping MSRV is a minor release.
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/slatkin/mbv"
keywords = ["emby", "tui", "media-player", "audiobookshelf", "terminal"]
categories = ["command-line-utilities", "multimedia::audio", "multimedia::video"]

[workspace.dependencies]
ureq = { version = "3", default-features = false }
# Force the vendored (statically built) OpenSSL for every binary in the
# workspace. The .deb must not depend on the host's libssl soname: OpenSSL 4
# (libssl.so.4) broke Debian 13, which ships libssl.so.3. The feature unifies
# across the graph, so `native-tls`'s openssl-sys links the vendored build too.
openssl = { version = "0.10", features = ["vendored"] }
percent-encoding = "2"
serde = { version = "1", default-features = false, features = ["std"] }
serde_json = "1"
# Wire-schema generation for the ctrl protocol conformance gate. Pinned at the
# major version: a schemars schema-format bump regenerates every committed
# schema and lands as one deliberate regen commit, never a side effect.
schemars = { version = "1", default-features = false, features = ["derive", "std"] }
toml = "1.1"
rand = "0.10"
uuid = { version = "1", default-features = false, features = ["std"] }
tungstenite = { version = "0.30", default-features = false }
log = "0.4"
indexmap = "2"
libc = "0.2"
mimalloc = "0.1"
pipewire = "0.10.1"
nix = { version = "0.32", default-features = false }
rstest = { version = "0.28", default-features = false }
fuzzy-matcher = "0.3"
time = { version = "0.3", default-features = false, features = ["std"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
tracing-log = "0.2"
ratatui = "0.30"
crossterm = "0.29"
tuirealm = "4.1"
textwrap = { version = "0.16", default-features = false }
ratatui-image = { version = "11", default-features = false }
image = { version = "0.25", default-features = false }
unicode-width = "0.2.2"
tui-scrollbar = "0.2.7"
rust_cast = "0.21"
mdns-sd = { version = "0.22", default-features = false }
flume = "0.12"
ab_glyph = "0.2"
num-traits = "0.2"
criterion = "0.8"
foldhash = "0.2"

[workspace.lints.clippy]
mod_module_files = "deny"
# Cannot be overridden by an inline allow/expect: params structs, not
# suppressions (issue #809).
too_many_arguments = "forbid"
cognitive_complexity = "warn"
excessive_nesting = "warn"
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
# nursery = { level = "warn", priority = -1 }  # optional, might cause more false positives
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
map_err_ignore = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
semicolon_outside_block = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"
# May cause issues with structured logging otherwise.
literal_string_with_formatting_args = "allow"
# Transitive dependency version skew (thiserror, getrandom, zbus family, etc.) —
# no source fix exists; converges as upstreams update (issue #804).
multiple_crate_versions = { level = "allow" }
# No rustdoc is published and the flagged fns are only reachable by same-repo
# path-dependency siblings, so hand-written `# Errors` sections would be filler
# (resolve-clippy-doc-lints / issue #816).
missing_errors_doc = { level = "allow" }
# Library crates below the shell must not write to the terminal — the shell owns
# stdout/stderr and a stray print corrupts the TUI (issue #908). The four
# packages that legitimately own a terminal stream mirror this block instead of
# inheriting it: the `mbv` TUI binary, the `mbvd` daemon, `mbv-core` (its
# examples are standalone CLI probes), and `mbv-owner` (its usage output, and
# the start-up failure its launching Client reads back). Keep those mirrors in
# sync with this block. `dbg!` is forbidden separately in clippy.toml (`disallowed-macros`,
# issue #923). Direct `io::stdout()`/`io::stderr()` writes are the deliberate
# escape hatch for the applog stderr sink and failure notice (mbv-core) and the
# palette.json maintainer hint (mbv-theme); keep that set minimal.
print_stdout = "deny"
print_stderr = "deny"

[workspace.lints.rust]
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[profile.bench]
# Keep enough debuginfo for readable criterion profiles without paying for
# full debug builds on manual bench runs (#896).
debug = 1

# Line tables only: file and line numbers for panics and backtraces, without the
# variable and type DWARF. With full debuginfo the Blitz, stylo, and wgpu stack
# made `mbv-gui` 1.1 GB (85% DWARF) and `target/debug` grew past 900 GB, which
# stalled the dev machine's disk on every build.
[profile.dev]
debug = "line-tables-only"

# Dependencies carry no debuginfo: the workspace crates keep their line tables,
# and a panic inside a dependency still names its function from the symbol
# table. Line tables alone left `mbv-gui` at 406 MB, 60% of it DWARF.
[profile.dev.package."*"]
debug = false

# The GUI's render stack at the debug profile's opt-level 0 makes every resize
# frame pay unoptimized restyle, layout, text shaping, scene building, and
# raster encoding on the event-loop thread, which is what stretches the stale
# buffer during a window drag. These packages are the hot path of one frame,
# so they take an optimized opt-level. They carry no debuginfo, like every
# dependency; the other unoptimized dependency crates stay as they are.
#
# opt-level 2, not 3: the loops are already vectorizable and the extra
# inlining of 3 mainly costs compile time on this dependency graph.
[profile.dev.package.stylo]
opt-level = 2

[profile.dev.package.stylo_taffy]
opt-level = 2

[profile.dev.package.taffy]
opt-level = 2

[profile.dev.package.blitz-dom]
opt-level = 2

[profile.dev.package.blitz-paint]
opt-level = 2

[profile.dev.package.kurbo]
opt-level = 2

[profile.dev.package.peniko]
opt-level = 2

[profile.dev.package.parley]
opt-level = 2

[profile.dev.package.parley_engine]
opt-level = 2

[profile.dev.package.fontique]
opt-level = 2

[profile.dev.package.read-fonts]
opt-level = 2

[profile.dev.package.skrifa]
opt-level = 2

[profile.dev.package.vello_common]
opt-level = 2

[profile.dev.package.vello_gpu]
opt-level = 2

[profile.dev.package.anyrender]
opt-level = 2

[profile.dev.package.anyrender_vello_hybrid]
opt-level = 2

[profile.dev.package.wgpu]
opt-level = 2

[profile.dev.package.wgpu-core]
opt-level = 2

[profile.dev.package.wgpu-hal]
opt-level = 2
