[workspace]
members = ["crates/mbv-core", "crates/mbv-ids", "crates/mbv-keybinds", "crates/mbvd"]
default-members = [".", "crates/mbv-core", "crates/mbv-ids", "crates/mbv-keybinds", "crates/mbvd"]

[workspace.package]
version = "0.21.2"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/slatkin/mbv"
keywords = ["emby", "tui", "media-player", "audiobookshelf", "terminal"]
categories = ["command-line-utilities", "multimedia::audio", "multimedia::video"]

[workspace.dependencies]
ureq = { version = "3", default-features = false, features = ["json", "native-tls"] }
native-tls = "0.2"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
libmpv2 = "6"
libmpv2-sys = "4"
rand = "0.10"
uuid = { version = "1", features = ["v4", "fast-rng"] }
tungstenite = { version = "0.30", features = ["native-tls"] }
log = "0.4"
libc = "0.2"
mimalloc = "0.1"
pipewire = "0.10.1"
nix = { version = "0.31", features = ["fs", "process", "signal", "term", "socket"] }
rstest = { version = "0.27", default-features = false }
fuzzy-matcher = "0.3"

[workspace.lints.clippy]
mod_module_files = "deny"
cognitive_complexity = "warn"
excessive_nesting = "warn"
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
# nursery = { level = "warn", priority = -1 }  # optional, might cause more false positives
allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
map_err_ignore = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
semicolon_outside_block = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"
too_long_first_doc_paragraph = "warn"
# May cause issues with structured logging otherwise.
literal_string_with_formatting_args = "allow"
# Transitive dependency version skew (thiserror, getrandom, zbus family, etc.) —
# no source fix exists; converges as upstreams update (issue #804).
multiple-crate-versions = { level = "allow" }

[workspace.lints.rust]
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[package]
name = "mbv"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Terminal UI client for Emby media servers."
default-run = "mbv"

[lints]
workspace = true

[[bin]]
name = "mbv"
path = "src/main.rs"

[dependencies]
mbv-core = { path = "crates/mbv-core" }
mbv-ids = { path = "crates/mbv-ids" }
mbv-keybinds = { path = "crates/mbv-keybinds" }
ratatui = "0.30"
crossterm = "0.29"
tuirealm = "4.1"
ureq.workspace = true
serde_json.workspace = true
toml.workspace = true
rand.workspace = true
textwrap = { version = "0.16", default-features = false, features = ["unicode-width"] }
fuzzy-matcher.workspace = true
zbus = { version = "4", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
ksni = { version = "0.3", features = ["blocking"] }
ratatui-image = { version = "11", default-features = false, features = ["crossterm"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
unicode-width = "0.2.2"
log.workspace = true
libc.workspace = true
mimalloc.workspace = true
nix.workspace = true
tui-scrollbar = "0.2.7"
time = { version = "0.3", features = ["parsing"] }
pipewire.workspace = true

[dev-dependencies]
mbv-core = { path = "crates/mbv-core", features = ["test"] }
uuid.workspace = true
rstest.workspace = true

[package.metadata.deb]
maintainer = "slatkin <slatkin@gmail.com>"
copyright = "2024, slatkin"
license-file = ["LICENSE", "0"]
extended-description = "Terminal UI client for Emby media servers. Embeds mpv for playback, syncs position with Emby, and supports full remote control via Emby's websocket API."
depends = "libmpv2 | libmpv1, libc6, libssl3 | libssl1.1, pipewire, libpipewire-0.3-0"
section = "video"
priority = "optional"
assets = [
    ["target/release/mbv", "usr/bin/mbv", "755"],
    ["contrib/mbv.desktop", "usr/share/applications/mbv.desktop", "644"],
    ["assets/icon.svg", "usr/share/icons/hicolor/scalable/apps/mbv.svg", "644"],
    ["scripts/mbv.lua", "usr/share/mbv/scripts/mbv.lua", "644"],
    ["scripts/mbv_state.lua", "usr/share/mbv/scripts/mbv_state.lua", "644"],
    ["scripts/mbv_helpers.lua", "usr/share/mbv/scripts/mbv_helpers.lua", "644"],
    ["scripts/mbv_render.lua", "usr/share/mbv/scripts/mbv_render.lua", "644"],
    ["scripts/mbv_options.lua", "usr/share/mbv/scripts/mbv_options.lua", "644"],
    ["scripts/mbv_lifecycle.lua", "usr/share/mbv/scripts/mbv_lifecycle.lua", "644"],
    ["scripts/mbv_events.lua", "usr/share/mbv/scripts/mbv_events.lua", "644"],
    ["scripts/mbv_visibility.lua", "usr/share/mbv/scripts/mbv_visibility.lua", "644"],
    ["scripts/mbv_intro.lua", "usr/share/mbv/scripts/mbv_intro.lua", "644"],
    ["fonts/Material-Design-Iconic-Font.ttf", "usr/share/mbv/fonts/Material-Design-Iconic-Font.ttf", "644"],
    ["dist/config.toml", "usr/share/mbv/config.toml", "644"],
]
